  WC.lesson({
    id: 'alternatives', part: 'materials', short: 'Alternative explanations', minutes: 18,
    title: 'Alternative explanations and <em>controls</em>',
    lede: 'An electrode is not an idealized copper crystal. Wetting, CO access, oxide fraction, contamination, local pH, the reactor and product recovery can all produce a “structure effect” that is not about catalyst structure, or can be the very way structure acts.',
    goals: ['The causal role of each variable: manipulated, controlled, measured, mediator, confounder, latent, artifact.', 'Which control constrains which alternative.', 'Why a transport effect can be a mediator rather than an artifact.'],
    concepts: ['c-roles', 'c-alternatives'],
    body: () => `
<p><q>Heated-support controls, loading, ICP-OES contamination checks and wetting/CO-access tests constrain alternative pathways [5]. … Transport can mediate a structural effect rather than invalidate it.</q> ${src('P04')}</p>
${widget('causal')}
${concept({
  title: 'Mediator or confounder? It depends on the cause',
  intuition: '<p>Suppose electrodes with one precursor flood more. If they flood because their architecture is more hydrophilic, flooding is <em>how</em> the architecture affects output: a mediator. If they flood because they happened to be assembled on a worse day, flooding is a nuisance that biases the comparison: a confounder. Same variable, different role.</p>',
  formal: '<p>In a causal graph with treatment X (processing), outcome Y (products) and a third variable W: W is a mediator if X → W → Y; a confounder if W → X and W → Y (or W varies with treatment assignment for reasons outside the treatment); a collider if X → W ← Y. Adjusting for a mediator removes part of the real effect; failing to adjust for a confounder biases it; adjusting for a collider creates bias.</p>',
  example: '<p>Architecture changes porosity, porosity changes CO access, CO access changes n-propanol output. Regressing output on CO access and calling the remainder “the structural effect” would discard the part of the effect that works through transport.</p>',
  counter: '<p>Xu et al. found anode-derived iridium contamination drove excess hydrogen evolution in CO MEAs ' + ref(5) + '. If iridium contamination differed between conditions because of cell assembly, its effect on products is not a structural effect at all.</p>',
  why: '<p>The proposal deliberately keeps both interpretations available: some controls remove nuisance pathways, others measure possible mediators. A reviewer will ask which is which.</p>',
  check: 'q-mediator',
})}
<h2><span class="h-num">12.1</span>What each control constrains</h2>
<div class="table-wrap"><table><thead><tr><th>Alternative</th><th>How it could imitate a structure effect</th><th>Check in the proposal</th><th>What would distinguish it</th></tr></thead><tbody>
<tr><td>Support changes</td><td>Heating alters the carbon paper’s wetting or surface chemistry</td><td>Heated-support controls</td><td>Bare heated paper behaves differently from unheated, and the difference tracks dwell</td></tr>
<tr><td>Loading</td><td>More copper per area changes current per site, local pH, transport</td><td>Loading measured</td><td>The effect disappears when compared at matched loading</td></tr>
<tr><td>Oxide fraction</td><td>Phase, not architecture, differs between dwells or endpoints</td><td>Diffraction at each stage; cooling-history route accepted only at matched oxide fraction</td><td>Effect persists when oxide fraction is matched by another route</td></tr>
<tr><td>Contamination</td><td>Metals (e.g., Ir from the anode, per Xu) change hydrogen evolution</td><td>ICP-OES contamination checks</td><td>Contaminant levels differ systematically between conditions</td></tr>
<tr><td>Wetting / flooding</td><td>Pores fill with liquid, starving CO, favoring H₂</td><td>Wetting and CO-access tests</td><td>Differences in flooding indicators, and whether architecture explains them</td></tr>
<tr><td>CO access / local pH</td><td>Transport limits change coverage and pH at the surface</td><td>CO-access tests</td><td>Effect changes with CO partial pressure or flow (background method)</td></tr>
<tr><td>Reactor / day</td><td>A channel or day performs differently</td><td>Day and channel balanced</td><td>Effect aligns with channel or day rather than treatment</td></tr>
<tr><td>Product recovery</td><td>Missing liquid product looks like low selectivity</td><td>Recovery, delay, outlet flow, crossover checks</td><td>Charge balance closes poorly in one condition</td></tr></tbody></table></div>
${call('unres', '<p><strong>Local pH is hard to measure directly in an MEA.</strong> The proposal does not name a local-pH measurement. Its influence is constrained indirectly through matched current, loading and transport checks. A reviewer may press on this; acknowledge it.</p>')}
${reviewer('A matched-oxide cooling-history control: how does that challenge the architectural interpretation?', 'It reaches a different architecture by a different thermal route while matching oxide fraction. If the structure–performance relationship learned from dwell also predicts the cooling-history samples, architecture is a better explanation than something specific to dwell. If it fails, the dwell effect is probably carried by something else. Matching oxide fraction does not match everything (wetting, strain, surface chemistry), so it challenges rather than proves.')}
${check('q-alt')}
`,
  });

  /* ---------------- Lesson 13 ---------------- */
  WC.lesson({
    id: 'replication', part: 'materials', short: 'Replication & pseudoreplication', minutes: 14,
    title: 'What counts as <em>another experiment</em>?',
    lede: 'A new image, a new GC injection, a new electrode cut from the same sheet, and a new coating/heating run answer different questions. For a claim about processing, only the last is a replicate.',
    goals: ['How to count independent preparations in a nested design.', 'Why more fields per electrode improve structural description but saturate as evidence about processing.', 'How blocking by day and channel protects comparisons.'],
    concepts: ['c-pseudorep'],
    body: () => `
<p><q>Independent coating/heating runs will be replicated, with day and channel balanced. Pilot variance and a predeclared meaningful interaction will determine confirmatory replication.</q> ${src('P03')}</p>
${widget('nested')}
${concept({
  title: 'Pseudoreplication',
  intuition: '<p>Asking one person the same question ten times is not a survey of ten people. Ten microscopy fields of one electrode tell you about that electrode; they say nothing new about whether another heating run would give the same electrode.</p>',
  formal: '<p>Define the experimental unit as the smallest unit to which a treatment is independently applied: here, a coating/heating run (and its assigned activation). Observations nested within a unit share its random deviation, so they are correlated. Treating them as independent understates the standard error and inflates significance.</p>',
  example: '<p>4 heated sheets × 3 coupons × 10 fields × 5 GC injections = 600 numbers, but 4 independent precursor preparations.</p>',
  counter: '<p>If a question is about measurement repeatability (how noisy is GC?), then repeated injections are the right replicate. The replicate depends on the claim.</p>',
  why: '<p>The 2×2 interaction is a claim about processing, so its uncertainty must be computed from independent preparations. Aim 2’s “repeat” action is defined as an independent preparation for the same reason.</p>',
  check: 'q-pseudo',
})}
${widget('variance')}
<h2><span class="h-num">13.1</span>Blocking and randomization</h2>
<p>If all CO-activated electrodes ran on Monday on channel 1 and all N₂ on Tuesday on channel 2, any day or channel difference would be indistinguishable from the gas effect. Balancing day and channel across conditions (blocking), and randomizing the order within a block, keeps those nuisance effects from aligning with a treatment ${src('P03')}.</p>
${call('mis', '<p><strong>“Not significant, so the conditions are the same.”</strong> With few preparations, a real interaction can easily be non-significant. Equivalence needs an interval inside predeclared meaningful bounds ' + go('evidence', 'Lesson 14') + '.</p>', { side: true })}
${reviewer('How many replicates will you run?', 'The proposal deliberately does not fix a number: it depends on preparation-level variance that does not exist yet. The pilot estimates that variance; the meaningful interaction is declared before confirmatory data; replication is sized so the interval for the interaction can resolve that size.')}
${check('q-pseudo-num')}
`,
  });

  /* ---------------- Lesson 14 ---------------- */
  WC.lesson({
    id: 'evidence', part: 'materials', short: 'What would convince us', minutes: 18,
    title: 'What result would <em>convince</em> us?',
    lede: 'Three different claims sit on three rungs: a processing effect, a structural interpretation, and a specific catalytic mechanism. Each rung needs evidence the rung below does not. This ladder is the spine of every answer you give.',
    goals: ['The evidence needed for each rung of the claim ladder.', 'How the proposal reads support, equivalence, limited relevance and unresolved results.', 'Why validation on a new preparation is part of the decisive test.'],
    concepts: ['c-ladder', 'c-falsify'],
    body: () => `
${widget('ladder')}
<h2><span class="h-num">14.1</span>Reading the result: four verdicts</h2>
<div class="claims">
${WC.claim('prop', '<q>Gas-dependent retention with a replicated product interaction supports co-design.</q> ' + src('P06'))}
${WC.claim('prop', '<q>Equivalent structural and product contrasts across activation gases argue against that interaction within predeclared meaningful bounds.</q>')}
${WC.claim('prop', '<q>Retained structure with convergent products limits its relevance to the measured output; imprecise results remain unresolved.</q>')}
</div>
<p>The crucial distinction is between “equivalent” and “unresolved.” Both can produce a non-significant test. They differ in how wide the uncertainty is compared with the effect that would matter.</p>
${widget('interval')}
${concept({
  title: 'No significant difference is not equivalence',
  intuition: '<p>A blurry photo that does not show a scratch is not proof the car is unscratched. You need a photo sharp enough that a scratch of meaningful size would have been visible.</p>',
  formal: '<p>Declare a smallest meaningful interaction δ before confirmatory data. Estimate the interaction with an interval (for example 90% for two one-sided tests). If the whole interval lies inside (−δ, +δ), declare equivalence. If it lies wholly outside 0 and beyond a bound, the interaction is supported. Anything else is unresolved.</p>',
  example: '<p>Estimate −1 mA cm⁻², interval (−2, 0), δ = 3: equivalent. Estimate −1, interval (−7, 5), δ = 3: unresolved, even though 0 is inside and the test is “not significant.”</p>',
  counter: '<p>A precise, tiny but nonzero interaction (interval 0.4 to 0.8 with δ = 3) is statistically different from zero yet practically equivalent. Significance and importance are different questions.</p>',
  why: '<p>It lets the proposal report an informative negative, rather than turning every null into “more work needed.”</p>',
  check: 'q-equiv',
})}
<h2><span class="h-num">14.2</span>The decisive comparison</h2>
<p><q>The decisive comparison tests whether the precursor contrast changes with activation, then validates a predicted structure–performance response in a new preparation.</q> ${src('P05')} Two steps: estimate the difference of differences with independent preparations, then use the structure–performance relationship to predict an electrode that was not used to build it. The second step separates a reproducible relationship from a story fitted to the data that produced it.</p>
${call('key', '<p><q>A processing interaction alone cannot establish a specific active-site mechanism.</q> Keep your claims on the rung your evidence reaches.</p>')}
${reviewer('What would make you abandon the structural hypothesis?', 'Equivalent contrasts across gases within the declared bounds; structural retention without any product interaction; or a matched-oxide cooling-history control that breaks the structure–performance relationship. An imprecise result abandons nothing; it is reported as unresolved.')}
${check('q-ladder')}
${check('q-verdict')}
`,
  });

  /* ---------------- Quiz bank: Part II ---------------- */
  WC.q({ id: 'q-dwell', lesson: 'synthesis', concepts: ['c-joule'], q: 'Two dwell times produce electrodes with the same grain size but different CuO/Cu₂O ratios. What has the dwell manipulation mainly changed?', choices: ['Architecture', 'Phase composition, which the interpretation must now account for', 'Nothing important'], correct: 1, explain: 'Dwell is a bundle of possible changes. Here it changed phase, which is why oxide fractions are measured and matched-oxide controls are required.' });
  WC.q({ id: 'q-trace', lesson: 'synthesis', concepts: ['c-joule'], q: 'Why record calibrated temperature traces instead of the electrical power setting?', choices: ['Power determines temperature exactly.', 'Contact resistance, emissivity and sheet nonuniformity make temperature vary at fixed power, and microstructural kinetics depend exponentially on temperature.', 'Temperature traces are required by NSF.'], correct: 1, explain: 'A small unrecorded temperature difference could masquerade as a dwell effect.' });
  WC.q({ id: 'q-charge', lesson: 'activation', concepts: ['c-charge'], q: 'Two electrodes receive identical charge during activation. Which statement is correct?', choices: ['They are reduced to the same extent.', 'They may be reduced to different extents, because charge splits among oxide reduction, hydrogen evolution and (under CO) CO reduction, and starting oxide fractions can differ.', 'The CO electrode is always more reduced.'], correct: 1, explain: 'Equal charge is an imposed history; the endpoint must be checked structurally.' });
  WC.q({ id: 'q-potential', lesson: 'activation', concepts: ['c-activation'], q: 'Under the same current program, why might a CO-fed and an N₂-fed cathode sit at different potentials?', choices: ['Because CO is heavier than N₂.', 'Under galvanostatic control the potential adjusts to whatever reactions can carry the current, and CO reduction offers additional pathways.', 'They cannot; same current means same potential.'], correct: 1, explain: 'Equal current is not equal driving force. The proposal reports voltage and checks endpoints rather than claiming equal potential.' });
  WC.q({ id: 'q-endpoint', lesson: 'activation', concepts: ['c-activation'], q: 'Why might an N₂-activated electrode change most at the start of the common CO test?', choices: ['Because the N₂ is still flowing.', 'It meets CO for the first time then; in Li et al., an N₂-derived surface restructured once CO operation began.', 'Because the current is higher in the test.'], correct: 1, explain: 'That is one reason for an early window and for post-operation structure.' });
  WC.q({ id: 'q-dod', lesson: 'twobytwo', concepts: ['c-interaction'], q: 'CO activation adds 6 mA cm⁻² at both dwells. What is the interaction?', choices: ['6', '12', '0'], correct: 2, explain: 'The gas effect is the same at both dwells, so the difference of differences is zero. That is a gas main effect.' });
  WC.q({ id: 'q-dod-num', lesson: 'twobytwo', concepts: ['c-interaction', 'c-pilot'], type: 'num', answer: -6, tol: 0.01, q: 'Cell means (mA cm⁻²): t₀/N₂ = 10, t₀/CO = 18, t₁/N₂ = 12, t₁/CO = 14. Compute Δ = g(t₁) − g(t₀).', explain: 'g(t₁) = 14 − 12 = 2; g(t₀) = 18 − 10 = 8; Δ = 2 − 8 = −6.' });
  WC.q({ id: 'q-main', lesson: 'twobytwo', concepts: ['c-interaction'], q: 'Lines on the interaction plot do not cross but are clearly not parallel. Is there an interaction on this scale?', choices: ['No, only crossing lines show interactions.', 'Yes, any non-parallel pattern is an interaction; crossing is a ranking reversal.', 'Only if p < 0.05.'], correct: 1, explain: 'Parallel lines mean equal gas effects at both dwells. Anything else is an interaction on the additive scale.' });
  WC.q({ id: 'q-xrd', lesson: 'structure', concepts: ['c-structure'], q: 'What does the Scherrer “crystallite size” from XRD measure?', choices: ['The grain size seen in TEM', 'The coherent-scattering domain size, which defects, subgrains, twins and strain can shorten', 'The particle size seen in SEM'], correct: 1, explain: 'Crystallite (coherent-domain) size, grain size and particle size are three different quantities.' });
  WC.q({ id: 'q-term', lesson: 'structure', concepts: ['c-structure'], q: 'Which feature is a property of how particles connect rather than of their crystals?', choices: ['Intragrain domain', 'Interparticle contact (connectivity)', 'Coherent domain'], correct: 1, explain: 'Connectivity describes necks and contacts between particles, which carry electrons and hold the layer together.' });
  WC.q({ id: 'q-airfree', lesson: 'journey', concepts: ['c-postmortem'], q: 'Protected and deliberately air-exposed samples look identical in TEM. What have you learned?', choices: ['The TEM shows the operando structure.', 'At this sensitivity, air handling is not dominating; the effect of removing bias is still unknown.', 'Air-free transfer is unnecessary.'], correct: 1, explain: 'The control estimates the handling effect, not the bias-removal effect. Only operando methods address the latter.' });
  WC.q({ id: 'q-companion', lesson: 'journey', concepts: ['c-companion'], q: 'As companion mismatch grows, what happens to a companion TEM measurement’s value for predicting the tested electrode?', choices: ['Nothing; TEM is precise.', 'It falls, because the measurement increasingly describes the companion rather than the tested electrode.', 'It rises, because more variability means more information.'], correct: 1, explain: 'A precise measurement of the wrong object is still about the wrong object. Mismatch must be measured and modeled.' });
  WC.q({ id: 'q-partial', lesson: 'products', concepts: ['c-partial'], type: 'num', answer: 45, tol: 0.5, q: 'Total current density 150 mA cm⁻², n-propanol Faradaic efficiency 30%. What is the n-propanol partial current density in mA cm⁻²?', explain: 'j = 150 × 0.30 = 45 mA cm⁻².' });
  WC.q({ id: 'q-recovery', lesson: 'products', concepts: ['c-products'], q: 'Only 70% of the n-propanol produced reaches the NMR tube because some evaporates and some crosses to the anode. What happens to the apparent FE?', choices: ['It is unaffected.', 'It is underestimated by 30% of its true value, and charge balance falls short.', 'It is overestimated.'], correct: 1, explain: 'Missed product reads as lower selectivity. Recovery checks and charge balance catch this.' });
  WC.q({ id: 'q-windows', lesson: 'products', concepts: ['c-windows'], q: 'Why is liquid collection delay important for early and late windows?', choices: ['It only affects the total.', 'If liquids take time to reach the collector, product made early can be counted in the late window, blurring evolution.', 'NMR cannot measure delayed samples.'], correct: 1, explain: 'Characterizing delay keeps each window’s products assigned to the right time.' });
  WC.q({ id: 'q-mediator', lesson: 'alternatives', concepts: ['c-roles'], q: 'Architecture changes porosity, which changes CO access, which changes output. You regress output on CO access and call the residual “the structural effect.” What went wrong?', choices: ['Nothing; that isolates structure.', 'CO access is a mediator here; adjusting for it removes part of the real structural effect.', 'You should have adjusted for output instead.'], correct: 1, explain: 'Transport can mediate a structural effect rather than invalidate it.' });
  WC.q({ id: 'q-alt', lesson: 'alternatives', concepts: ['c-alternatives'], q: 'Which check addresses contamination from the anode, like the iridium Xu et al. identified?', choices: ['Heated-support control', 'ICP-OES contamination checks', 'Blinded TEM'], correct: 1, explain: 'ICP-OES measures elemental contaminants; Ir contamination drove excess hydrogen evolution in CO MEAs.' });
  WC.q({ id: 'q-pseudo', lesson: 'replication', concepts: ['c-pseudorep'], q: '4 independent heated sheets, 3 coupons per sheet, 10 microscopy fields per coupon, 5 GC injections per test. How many independent precursor preparations?', choices: ['4', '12', '600'], correct: 0, explain: 'Coupons, fields and injections are nested within sheets. They describe each preparation more precisely but are not new preparations.' });
  WC.q({ id: 'q-pseudo-num', lesson: 'replication', concepts: ['c-pseudorep'], type: 'num', answer: 3, tol: 0, q: 'Three electrodes, each from its own heating run, are each imaged in 40 TEM fields. How many independent preparations support a processing claim?', explain: 'Three. The 120 fields are nested measurements.' });
  WC.q({ id: 'q-equiv', lesson: 'evidence', concepts: ['c-falsify'], q: 'Interaction estimate 0.5 mA cm⁻², 90% interval (−6, 7), meaningful bound ±3. Verdict?', choices: ['Equivalent: no interaction.', 'Unresolved: the interval includes both 0 and meaningful values.', 'Supported interaction.'], correct: 1, explain: 'Non-significance is not equivalence. The interval is too wide to decide.' });
  WC.q({ id: 'q-ladder', lesson: 'evidence', concepts: ['c-ladder'], q: 'You have a replicated product interaction plus matching structural differences at the activation endpoint. Which claim is supported?', choices: ['A specific active site', 'A processing interaction with a supported structural interpretation, not a mechanism', 'Nothing beyond correlation'], correct: 1, explain: 'A mechanism needs site-sensitive evidence (e.g., operando spectroscopy, isotopes, kinetics), which this is not.' });
  WC.q({ id: 'q-verdict', lesson: 'evidence', concepts: ['c-falsify'], q: 'Structure differs between gases, but late-window n-propanol is equivalent within bounds. What does the proposal conclude?', choices: ['H1 supported', 'Retained structure with convergent products limits its relevance to the measured output', 'The structural measurement must be wrong'], correct: 1, explain: 'It bounds relevance to this output and window; it does not say structure never matters.' });
})();

(function () {
  'use strict';

  /* ---------------- Lesson 15 ---------------- */
  WC.lesson({
    id: 'hardware', part: 'sdl', short: 'What physically gets automated', minutes: 14,
    title: 'What physically gets <em>automated</em>',
    lede: 'A self-driving lab is hardware, software and safety engineering before it is an algorithm. Here is the physical station the proposal describes, what is robotic, what stays manual or shared, and what you would actually build.',

    concepts: ['c-hardware'],

${widget('station')}
${claims([
  ['est', 'Robotic gas-fed electrode testing exists: Soni et al.’s seven-robot platform fabricated, characterized and tested up to 90 GDEs per campaign for CO₂ electrolysis ' + ref(3) + '.'],
  ['prop', 'Robotic coating and Joule heating, cassette handling, gas switching and MEA testing, driven by one scheduler ' + src('P08') + '.'],
  ['prop', 'Extend one station before parallelizing ' + src('P10') + '.'],
  ['asm', 'A host lab with existing gas-fed testing and shared microscopy and NMR will be found. The proposal says “seek”; nothing is confirmed ' + src('P10') + '.'],
  ['pilot', 'Which assays are automated versus manual, the cassette design, and the instrument interfaces. Not specified.'],
])}
${call('mis', '<p><strong>“Self-driving means every instrument is robotic.”</strong> The defining feature is that the model’s decision changes the next physical experiment. Facility TEM and a shared NMR can stay manual if their interfaces and delays are recorded honestly ' + src('P08') + '.</p>', { side: true })}
<h2><span class="h-num">15.1</span>What you would physically be doing</h2>
<div class="table-wrap"><table><thead><tr><th>Period</th><th>Bench and build work</th><th>Software and analysis</th></tr></thead><tbody>
<tr><td>Year 1</td><td>Tune spray coating and Joule heating; calibrate temperature measurement; design and machine a cassette; validate GC and NMR recovery with spikes; run the 2×2 pilot by hand and with partial automation; measure companion mismatch.</td><td>Instrument drivers; a sample database with lineage (sheet → coupons → tests → assays); variance-component estimates from the pilot.</td></tr>
<tr><td>Year 2</td><td>Integrate gas switching and cassette handling with the test station; commission CO interlocks with safety staff; collect the policy-independent reference archive.</td><td>Scheduler, joint model, acquisition function; replay harness that reveals only paid-for data.</td></tr>
<tr><td>Year 3</td><td>Run prospective campaigns interleaved across days; new preparations and held-out conditions; selected 50-hour tests.</td><td>Benchmarking against baselines; ablations; write-up and data release.</td></tr></tbody></table></div>
<p class="small muted ui">${ev('bgd', 'Interpretation')} Built from the proposal’s three-year plan ${src('P10')}. The split of tasks is a plausible reading, not a commitment in the text.</p>
${reviewer('What does your robot do that a technician following a design of experiments would not?', 'A technician executes a list chosen in advance. The SDL changes the next experiment based on what it has learned, including whether to spend effort on a new condition, an independent repeat or a slow structural assay, and it plans around results still in flight. Whether that adaptivity is worth anything is Aim 2’s hypothesis, tested against fixed and adaptive baselines on the same budget.')}
${call('asm', '<p>Unattended CO operation requires professionally reviewed interlocks and commissioning ' + src('P10') + '. CO is toxic and odorless; detection, ventilation and automatic shutoff are institutional requirements, not optimizer settings. This guide contains no operating setpoints or safety procedure.</p>')}
${check('q-sdl')}
`,
  });

  /* ---------------- Lesson 16 ---------------- */
  WC.lesson({
    id: 'loops', part: 'sdl', short: 'Fast loop vs slow loop', minutes: 15,
    title: 'Fast loop versus <em>slow loop</em>',
    lede: 'Gas products arrive in minutes, liquid products in hours or days, facility microscopy in days or weeks. A lab that waits for everything before deciding mostly waits. A scheduler lets decisions proceed on the information that exists, and folds in the rest when it arrives.',
    goals: ['Which information is immediate and which arrives with latency.', 'Why the system must choose the next experiment before all previous results return.', 'How cheap inline proxies differ from destructive companion assays.'],
    concepts: ['c-latency'],
    body: () => `
<div class="table-wrap"><table><thead><tr><th>Information</th><th>Typical latency</th><th>Destroys the specimen?</th><th>Tells you about</th></tr></thead><tbody>
<tr><td>Temperature trace, loading, optical image</td><td>Immediate</td><td>No</td><td>The preparation as made</td></tr>
<tr><td>Quick precursor diffraction</td><td>About an hour</td><td>No</td><td>Phases, coherent-domain size</td></tr>
<tr><td>Voltage, online GC (gases)</td><td>Minutes, during the test</td><td>No</td><td>Hydrogen, ethylene; the electrode’s health</td></tr>
<tr><td>Quantitative NMR (liquids, incl. n-propanol)</td><td>Hours to days (shared queue)</td><td>No (sample)</td><td>The primary outcome</td></tr>
<tr><td>Post-operation XRD/SEM</td><td>Hours</td><td>Perturbs (removed from cell)</td><td>Post-operation phases and morphology</td></tr>
<tr><td>Blinded TEM on companions</td><td>Days to weeks</td><td>Yes</td><td>Grain/subgrain and surface structure, locally</td></tr></tbody></table></div>
<p class="small muted ui">${ev('pilot', 'Illustrative latencies')} The proposal names the assays and the existence of delay, not the times.</p>
${widget('timeline')}
${concept({
  title: 'Deciding with results still in flight',
  intuition: '<p>If you have ordered an experiment, you know you will learn something about that condition even before you know the answer. A good scheduler counts that future information when choosing the next experiment, so it does not order the same thing twice.</p>',
  formal: '<p>In a linear-Gaussian model, the posterior covariance after an observation depends on <em>where</em> and <em>how noisily</em> you observe, not on the value you will see. So the controller can condition its uncertainty on pending experiments exactly, before their results return, and choose the next action against that “planned” covariance. The posterior mean updates only when the value arrives. For non-Gaussian models, the same idea is approximated by imagining (“fantasizing”) the pending results.</p>',
  example: '<p>Two electrodes at dwell t₃ are in the NMR queue. Without accounting for them, the controller sees high uncertainty at t₃ and orders a third. Conditioning on the pending pair, it sees that t₃ is already covered and picks t₅ instead.</p>',
  counter: '<p>If the model is badly wrong about how informative a pending assay is (for example, the TEM link is weaker than assumed), conditioning on it will make the controller overconfident until the result arrives. That is one reason the proposal validates the assay link before relying on it.</p>',
  why: '<p><q>Delayed results update subsequent batches.</q> ' + src('P08') + ' Delay is also counted in cost: an informative assay that takes three weeks may lose to a slightly less informative one that takes a day.</p>',

})}
${call('key', '<p><strong>Inline proxies versus destructive companions.</strong> A proxy measured on the tested electrode (mass, a quick diffraction pattern, voltage) is cheap, immediate and about the right object, but less specific. A destructive assay on a companion is specific and slow, and it describes a different object. The controller weighs both, and their costs, against the same target.</p>')}
${reviewer('Why not just wait for all results before choosing the next experiment?', 'Because the slowest results take days or weeks, so the lab would sit idle most of the time, and channel time is the scarce resource. The model can account for pending experiments exactly in a linear-Gaussian setting and approximately otherwise, so it can keep the station busy without duplicating work.')}
${check('q-latency')}
`,
  });

  /* ---------------- Lesson 17 ---------------- */
  WC.lesson({
    id: 'actions', part: 'sdl', short: 'Make / measure / repeat', minutes: 13,
    title: '<em>Make</em>, <em>measure</em>, <em>repeat</em>',

<p><q>The controller selects a new preparation–activation pair, independent repeat or validated structural assay…</q> ${src('P08')}</p>
${widget('actions')}
${claims([
  ['prop', '<strong>Make</strong>: a new preparation–activation pair at a condition (dwell, gas composition) not yet tested, within the validated window.'],
  ['prop', '<strong>Repeat</strong>: an independent coating/heating run at an already-tested condition. A new GC injection or image is not a repeat.'],
  ['prop', '<strong>Measure</strong>: a validated structural assay on a companion (or a post-test specimen). It costs a specimen, instrument time, analysis and delay.'],
  ['prop', '<strong>Not choices:</strong> calibrations, compulsory controls and safety checks are scheduled for every policy and charged to every policy ' + src('P08') + '.'],
])}
<h2><span class="h-num">17.1</span>When things fail</h2>
<p><q>Equipment faults invalidate measurements; reproducible material failures remain feasibility outcomes.</q> ${src('P08')}</p>
${widget('failures')}
${call('mis', '<p><strong>“Delete failed runs so they don’t bias the model.”</strong> Deleting reproducible delamination at one preparation makes a fragile recipe look good. Material failures are data about feasibility; only equipment faults are removed, and they are logged.</p>', { side: true })}
${reviewer('Isn’t “repeat” just replication you would do anyway?', 'In a fixed design, yes. Here repeat competes for budget with new conditions and assays. Repeating is worth it when the uncertainty about θ is dominated by noise at a tested condition; exploring is worth it when it is dominated by untested regions. Binois et al. study exactly this trade-off for stochastic simulators.')}

  /* ---------------- Lesson 18 ---------------- */
  WC.lesson({
    id: 'model', part: 'sdl', short: 'What the model believes', minutes: 16,
    title: 'What the model <em>believes</em>',
    lede: 'The model holds a best guess and an uncertainty for the quantity it is learning. The uncertainty is the part that decides experiments. It is also the part that can be confidently wrong.',
    goals: ['What a posterior mean and posterior uncertainty are, intuitively and formally.', 'What “hierarchical joint model” means, level by level.', 'Why better prediction from structural data is not proof of causal mediation, and what counts as leakage.'],
    concepts: ['c-posterior', 'c-mediation'],
    body: () => `
${concept({
  title: 'Posterior uncertainty',
  intuition: '<p>Before data, the model allows many plausible curves. Each measurement rules some out. The spread of curves that remain is the posterior uncertainty. It is narrow near good data and wide far from it.</p>',
  formal: '<p>With prior p(f) and data D, the posterior is p(f | D) ∝ p(D | f) p(f). For Gaussian priors and noise it is Gaussian, with mean μ(t) and variance σ²(t) at each input. A 95% pointwise interval is μ ± 1.96σ. It describes uncertainty about the <em>expected</em> response, not the spread of individual electrodes, and it is only as trustworthy as the model assumptions.</p>',
  example: '<p>Click to add synthetic observations in the explorer below and watch the band pinch around them.</p>',
  counter: '<p>A model with too-short memory (small length-scale) or too-small noise will show a narrow band that misses the truth. That is why the proposal checks calibration: do nominal 95% intervals actually contain held-out values about 95% of the time?</p>',
  why: '<p>The controller’s job is to shrink posterior uncertainty about θ cheaply. If the uncertainty is miscalibrated, the controller optimizes the wrong thing. The primary score therefore requires validation error and calibration limits, not just narrow intervals ' + src('P09') + '.</p>',
  check: 'q-posterior',
})}
${widget('posterior')}
<h2><span class="h-num">18.1</span>A hierarchical joint model, level by level</h2>
<p><q>A hierarchical joint model will link processing, structure and performance, including preparation/reactor variation and measurement error.</q> ${src('P07')}</p>
<div class="table-wrap"><table><thead><tr><th>Level</th><th>What varies</th><th>Why it must be modeled</th></tr></thead><tbody>
<tr><td>Condition (dwell, gas)</td><td>The expected response m(t, a) and θ(t)</td><td>The target</td></tr>
<tr><td>Preparation (heating run)</td><td>Run-to-run deviation</td><td>The replicate level for processing claims</td></tr>
<tr><td>Specimen (performance vs companion)</td><td>Companion mismatch</td><td>Lets a companion assay inform the tested electrode, with the right uncertainty</td></tr>
<tr><td>Reactor channel and day</td><td>Block effects</td><td>Prevents equipment drift from looking like chemistry</td></tr>
<tr><td>Measurement</td><td>Assay noise (GC, NMR, TEM fields)</td><td>Nested measurements are not new preparations</td></tr></tbody></table></div>
<p><strong>Joint</strong> means structure and performance are modeled together, so a structural assay can sharpen predictions of performance through a learned relationship. The <a href="#notes">refinement notes</a> add a crucial constraint: direct processing-to-performance paths are kept, so the model does not force every effect through a measured structural descriptor.</p>
${call('unres', '<p>The two pages commit to the structure of the model, not to a kernel, priors, or an identifiability analysis ' + src('P07') + '. The explorers in this guide use a simple Gaussian-process-like model for teaching; they are not the research model.</p>')}
${concept({
  title: 'Prediction is not mediation',
  intuition: '<p>Ice-cream sales predict sunburn. That does not mean ice cream causes sunburn; sunshine causes both. A structural descriptor that predicts n-propanol output may simply share a cause with it.</p>',
  formal: '<p>Predictive value: p(Y | X, S) is sharper than p(Y | X). Mediation: part of the effect of X on Y flows through S, so intervening on S (holding X) would change Y. The first can hold without the second when a common cause (e.g., dwell changes both grain structure and loading) drives S and Y.</p>',
  example: '<p>If removing structural inputs (the ablation) makes θ predictions worse, structure carries information. To argue it mediates, the proposal uses an independent route to the structure (the matched-oxide cooling-history comparison).</p>',
  counter: '<p>A descriptor with no predictive value can still be a mediator if it is measured too noisily or on a mismatched companion. Weak prediction is not proof of irrelevance either.</p>',
  why: '<p><q>Pretest companion data can inform predictions without proving mediation; post-test data support interpretation.</q> ' + src('P07') + '</p>',
  check: 'q-mediation',
})}
${call('mis', '<p><strong>Leakage.</strong> Using a post-test measurement of an electrode to “predict” that same electrode’s test result is not a prediction. The record must store when each measurement became available, and replay must respect it.</p>')}
${reviewer('Does a Gaussian process prove a mechanism?', 'No model fit proves a mechanism. A GP (or any surrogate) summarizes what the data say about a response and how uncertain that is. Mechanistic claims need interventions and site-sensitive evidence, which is why the claim ladder caps what a processing interaction can support.')}
`,
  });

  /* ---------------- Lesson 19 ---------------- */
  WC.lesson({
    id: 'theta', part: 'sdl', short: 'θ(t): what is learned', minutes: 18,
    title: 'θ(t): the quantity being <em>learned</em>',
    lede: 'One curve ties the materials hypothesis, the controller and the benchmark together. It asks, at each heating dwell, whether the benefit of activating in CO rather than N₂ is different from what it is at a reference dwell.',
    goals: ['How g(t) and θ(t) are built from the two response curves.', 'Why θ(t) = 0 everywhere means no synthesis–activation interaction relative to the reference.', 'How the 2×2 pilot is one point on this curve, and what “integrated posterior variance” measures.'],
    concepts: ['c-theta'],
    body: () => `
<div class="table-wrap"><table><tbody>
<tr><th scope="row">t</th><td>Heating dwell, a preparation variable. <strong>Not</strong> time spent operating the catalyst.</td></tr>
<tr><th scope="row">a</th><td>Activation-gas composition (pilot: CO or N₂).</td></tr>
<tr><th scope="row">m(t, a)</th><td>Expected late-window n-propanol partial current density at dwell t after activation in gas a, under the shared test.</td></tr>
<tr><th scope="row">t<sub>ref</sub></th><td>A reference dwell fixed before confirmatory evaluation.</td></tr></tbody></table></div>
${eq('g(t) = m(t, CO) − m(t, N<sub>2</sub>)', 'The activation (gas) effect at dwell t.')}
${eq('θ(t) = g(t) − g(t<sub>ref</sub>)', 'How much that gas effect differs from its value at the reference dwell. θ(t_ref) = 0 by definition.')}
${concept({
  title: 'Why subtracting the reference isolates the interaction',
  intuition: '<p>Imagine CO always adds the same boost, whatever the dwell. Then every g(t) is the same number, and subtracting g(t<sub>ref</sub>) gives zero everywhere. A boost that is the same for every precursor tells you nothing about precursor history, so θ ignores it. Only a boost that changes with dwell survives the subtraction.</p>',
  formal: '<p>Decompose m(t, a) = μ + D(t) + G(a) + I(t, a), with I(t, a) the interaction. Then g(t) = G(CO) − G(N₂) + I(t, CO) − I(t, N₂). The first part is constant in t and cancels in θ, as does the dwell main effect D(t), which appears in both gases. θ(t) = [I(t,CO) − I(t,N₂)] − [I(t<sub>ref</sub>,CO) − I(t<sub>ref</sub>,N₂)]: pure interaction, measured relative to the reference.</p>',
  example: '<p>Pilot with dwells t₀ = t<sub>ref</sub> and t₁: θ(t₁) = g(t₁) − g(t₀), which is exactly the 2×2 difference of differences from lesson 8. The pilot is one point on θ.</p>',
  counter: '<p>Both gases get better with longer dwell by the same amount: m rises with t for both, the lines stay parallel, g is constant, θ = 0. A large dwell effect is not an interaction.</p>',
  why: '<p><q>This interaction curve is the common target for decisions and scoring.</q> ' + src('P07') + ' The controller cannot claim success by finding a high-yield recipe; it has to learn this curve.</p>',
  check: 'q-theta-zero',
})}
${widget('theta')}
${rig(`<p><strong>Integrated posterior variance.</strong> Fix a grid {t<sub>i</sub>} and nonnegative weights w<sub>i</sub> summing to one before confirmatory data:</p>${eq('V(D) = Σ<sub>i</sub> w<sub>i</sub> · Var[θ(t<sub>i</sub>) | D]', 'D is the data acquired so far. Each variance is about the expected interaction, not the spread of individual electrodes.')}<p><strong>Reference covariance.</strong> Every θ(t<sub>i</sub>) shares the term g(t<sub>ref</sub>), so Var θ(t<sub>i</sub>) = Var g(t<sub>i</sub>) + Var g(t<sub>ref</sub>) − 2 Cov(g(t<sub>i</sub>), g(t<sub>ref</sub>)), and the θ values are correlated with each other. Uncertainty at the reference dwell propagates into the whole curve, so it pays to measure the reference well.</p><p><strong>Why fix the grid and weights?</strong> Otherwise a method could look better by emphasizing regions that turned out easy. All policies share them ${src('P08')}.</p><p><strong>Scale.</strong> θ is defined on the additive scale of partial current density. A ratio scale would ask a different question; the scale is fixed in advance.</p>`, 'integrated variance and the reference')}
${call('unres', '<p>The reference dwell, grid, weights, gas compositions beyond CO and N₂, and the precision threshold τ² are not given numerically in the proposal ' + src('P08') + '. They are set before confirmatory evaluation.</p>', { side: true })}
${check('q-theta-t')}
${check('q-theta-num')}
`,
  });

  /* ---------------- Lesson 20 ---------------- */
  WC.lesson({
    id: 'acquisition', part: 'sdl', short: 'Cost-aware selection', minutes: 22,
    title: 'Cost-aware <em>experimental selection</em>',
    lede: 'Score every possible next action by how much it is expected to shrink uncertainty about θ, divided by what it costs. Make, measure and repeat then compete on one scale, and an expensive assay has to earn its place.',
    goals: ['What the acquisition function computes, conceptually and formally.', 'How noise, assay reliability, companion mismatch, cost and unexplored uncertainty change the recommended action.', 'Why characterization can improve prediction without proving mediation.'],
    concepts: ['c-acquisition', 'c-actions'],
    body: () => `
${eq('U(action) = [ V(D) − E{ V(D ∪ new observations) | action } ] / c(action)', 'Expected reduction in integrated posterior variance of θ, per unit of declared resource cost (preparation, instrument occupancy, analysis, delay).')}
<p>Read it as “uncertainty removed per unit of effort.” An action can win by removing a lot of uncertainty, or by being cheap. It does not need to produce the best catalyst. The toy below computes this exactly for a small linear-Gaussian model so you can watch the trade-offs.</p>
${widget('sandbox')}
${concept({
  title: 'When is an expensive structural measurement worth buying?',
  intuition: '<p>A TEM measurement is worth buying when it tells you more about θ, per unit cost, than anything else you could do. That needs three things: the structural descriptor must actually track performance (a validated link), the companion must resemble the tested electrode, and the full cost, including waiting, must not be crushing.</p>',
  formal: '<p>In the toy, a structural assay at condition i observes g(t<sub>i</sub>) with noise variance r<sub>meas</sub> = σ<sub>link</sub>² + σ<sub>c</sub>², where σ<sub>link</sub>² = s²(1 − ρ²)/ρ² from the assay–performance correlation ρ, and σ<sub>c</sub> is companion mismatch. A paired performance test has variance r<sub>test</sub> = σ<sub>e</sub>². The assay wins when its variance reduction per cost beats the best make or repeat. As ρ falls or σ<sub>c</sub> grows, r<sub>meas</sub> explodes and the assay stops being worth buying regardless of how precise the instrument is.</p>',
  example: '<p>Set reliability high, mismatch low and cost moderate in the sandbox: MEASURE wins. Drop reliability to 0.4: MAKE or REPEAT takes over.</p>',
  counter: '<p>A sophisticated, expensive assay with a weak link to θ should be bought rarely or never. “Expensive assays must earn their use” ' + src('P08') + '. And a cheap assay is not automatically informative either.</p>',
  why: '<p>This is the bounded autonomy contribution: <q>Adaptive characterization and replication exist [6,7]; here the challenge is delayed, destructive assays on imperfectly matched companions.</q> ' + src('P07') + '</p>',
  check: 'q-expensive',
})}
${claims([
  ['est', 'SARA chose both synthesis and characterization actions with hierarchical active learning, using fast, non-destructive optical spectroscopy ' + ref(6) + '.'],
  ['est', 'Binois et al. decide between replicating and exploring with a lookahead integrated-variance (IMSPE) criterion and heteroskedastic GPs, for stochastic simulators ' + ref(7) + '.'],
  ['prop', 'Extend such choices to delayed, destructive assays on imperfect companions, toward θ, with costs that include delay ' + src('P07') + ' ' + src('P08') + '.'],
  ['sim', 'The sandbox is a teaching model: seven grid points, a known assay link, one action per day. It is not the research acquisition algorithm.'],
])}
${call('key', '<p><strong>Characterization can improve prediction without proving mediation.</strong> If structure sharpens predictions of θ, the controller should buy it. That says structure carries information, not that structure causes the product change ' + go('model', 'Lesson 18') + '.</p>')}
${reviewer('Why is this more than Bayesian optimization?', 'Bayesian optimization looks for the best input. Here the goal is a precise curve, θ(t), so the criterion is integrated variance, not expected improvement. The action space includes measuring and repeating, with different costs and latencies, and success is gated by validation error and calibration, not just a narrower posterior.')}
${check('q-acq')}
`,
  });

  /* ---------------- Lesson 21 ---------------- */
  WC.lesson({
    id: 'replay', part: 'sdl', short: 'Replay vs prospective', minutes: 16,
    title: 'Replay versus <em>prospective</em> experiments',
    lede: 'Replay lets many policies face the same recorded evidence cheaply. It is honest only if the archive was collected independently of any policy and a policy can see only what it paid for. Even then, replay cannot make a new electrode.',
    goals: ['The four kinds of data: commissioning pilot, reference archive, hidden validation, prospective campaigns.', 'Why the archive must be policy-independent and how pay-to-reveal works.', 'Why repeated replay is not repeated physical synthesis.'],
    concepts: ['c-replay'],
    body: () => `
<div class="table-wrap"><table><thead><tr><th>Data</th><th>What it is</th><th>What it is for</th><th>What it must not be used for</th></tr></thead><tbody>
<tr><td>Commissioning pilot</td><td>Early runs to establish safe conditions, reproducibility, reduction checks, recovery, precision, real costs</td><td>Defining the bounded domain and realistic costs</td><td>Choosing a benchmark that flatters a favored policy</td></tr>
<tr><td>Reference archive</td><td>A separate, fixed, replicated grid of independent preparations with paired structural and product data, failures, timestamps and costs</td><td>Replay: comparing policies on identical finite evidence</td><td>Being generated by, or scored only where, the adaptive policy chose</td></tr>
<tr><td>Hidden validation preparations</td><td>Independent preparations reserved before replay, with all their images, windows and companions</td><td>Scoring error and calibration of θ</td><td>Guiding any policy’s choices</td></tr>
<tr><td>Prospective campaigns</td><td>New physical experiments run by each policy, interleaved across days</td><td>Testing real execution, new material, real delays and faults</td><td>Being run sequentially so one policy gets a better week</td></tr></tbody></table></div>
<p class="small muted ui">From the proposal ${src('P09')} and the <a href="#notes">refinement notes</a>, §3.</p>
${widget('replay')}
${concept({
  title: 'Why replay is useful but not sufficient',
  intuition: '<p>Replay is like a flight simulator built from recorded flights. You can compare pilots cheaply and fairly, but only on situations that were recorded, and no number of simulator hours is a real landing.</p>',
  formal: '<p>A replay run is a policy interacting with a finite archive A: at each step it selects an action whose result exists in A and has not been consumed, pays its recorded cost, and receives the recorded value, available only after the recorded latency. Many seeds give a distribution over policy behavior on A, not over new physical experiments. Generalization beyond A needs prospective data.</p>',
  example: '<p>A policy wants a third repeat at a condition with two archived preparations. Replay must refuse: that preparation was never made.</p>',
  counter: '<p>A fixed-grid policy may happen to match the archive’s grid. That is a known coverage limitation of a finite archive, which is why new conditions are also tested prospectively.</p>',
  why: '<p><q>Replay reveals only acquired measurements; independent validation preparations remain hidden.</q> ' + src('P09') + ' And building the archive costs real bench time; it is not free.</p>',
  check: 'q-replay',
})}
${reviewer('Why isn’t replay enough to show the SDL works?', 'Replay re-reads existing measurements. It cannot create a new preparation, reproduce real delays and failures, or test conditions the archive never recorded, and many seeds are many algorithm runs over one finite evidence set. Prospective campaigns interleaved across days, plus condition and preparation holdouts, test what replay cannot.')}
${call('mis', '<p><strong>“1000 replay seeds means 1000 experiments.”</strong> It means 1000 runs of the algorithm over the same physical evidence. Uncertainty about physical performance should reflect the number of physical campaigns ' + src('P09') + '.</p>', { side: true })}
${check('q-policyind')}
`,
  });

  WC.lesson({
    id: 'benchmark', part: 'sdl', short: 'Benchmarking autonomy fairly', minutes: 18,
    title: 'Benchmarking autonomy <em>fairly</em>',
    lede: 'Do not let the controller mark its own exam. Same domain, same starting data, same models, same compulsory controls, same budget; scored on cost to a precision threshold, but only if the answer is also accurate and honestly uncertain.',
    goals: ['The baselines and what must be shared.', 'The primary score and why validation error and calibration gate it.', 'What condition and preparation holdouts each test, and what pseudoreplication and leakage look like in a split.'],
    concepts: ['c-holdout', 'c-aims'],
    body: () => `
<div class="table-wrap"><table><thead><tr><th>Policy</th><th>What it chooses</th><th>Shared by all</th></tr></thead><tbody>
<tr><td>Space-filling design</td><td>A fixed plan spread across the declared domain</td><td rowspan="3">Candidate domain, models, starting data, compulsory controls, cost definition and budget ${src('P09')}</td></tr>
<tr><td>Adaptive synthesis–activation search</td><td>Which conditions to make; characterization and replication on a fixed schedule</td></tr>
<tr><td>Full controller (proposed)</td><td>New conditions, independent repeats and validated structural assays</td></tr></tbody></table></div>
<p>The middle baseline matters most. Beating it isolates the value of choosing when to measure and when to repeat, which is the proposal’s actual claim.</p>
${eq('Primary score = accumulated cost to reach V(D) ≤ τ²', 'Subject to predeclared validation-error and calibration limits on θ. A narrow but wrong posterior fails. Policies that never reach τ² within budget are reported as such.')}
${claims([

  ['prop', '<q>Condition and preparation holdouts distinguish transfer from reproducibility.</q> ' + src('P09')],
  ['prop', '<q>Removing structural inputs tests their value; unresolved comparisons are not wins.</q>'],
  ['pilot', 'τ², the error and calibration limits, cost weights and the number of campaigns. Report uncombined costs and sensitivity to weights.'],

${widget('holdout')}
${reviewer('If the adaptive policy wins by a small margin in two prospective campaigns, have you shown it is better?', 'No. With two campaigns the uncertainty in the difference is large; the comparison would be reported as unresolved. The claim scales with the number of physical campaigns, interleaved across days so drift is shared.')}
${call('mis', '<p><strong>“The controller reached a narrower posterior, so it won.”</strong> Narrowness without accuracy is overconfidence. The score requires the same θ to pass validation-error and calibration limits.</p>', { side: true })}
${check('q-holdout')}
${check('q-score')}
`,
  });

    const i = WC.lessonIndex(id);
    const view = $('#view');
    if (i < 0) { view.innerHTML = `<div class="lesson"><h1>Lesson not found</h1><p><a href="#home">Back to the start</a></p></div>`; return; }
    const l = WC.lessons[i];
    const part = WC.PARTS.find((p) => p.id === l.part);
    const prev = WC.lessons[i - 1], next = WC.lessons[i + 1];
    WC.state.visited[l.id] = Date.now();
    const daySeed = Math.floor(Date.now() / 864e5) * 31 + i;
    const review = i > 1 ? WC.pickReview(i, 2, daySeed) : [];
    const noteId = `note-${l.id}`;
    view.innerHTML = `
<article class="lesson" aria-labelledby="lesson-title">
  <header class="lesson-head">
    <div class="kicker"><span class="k-part">Part ${part.n} · ${esc(part.title)}</span><span>Lesson ${i + 1} of ${WC.lessons.length}</span>${l.minutes ? `<span class="k-part">~${l.minutes} min</span>` : ''}</div>
    <h1 id="lesson-title">${l.title}</h1>
    ${l.lede ? `<p class="lede">${l.lede}</p>` : ''}
    ${l.goals ? `<div class="goals"><b>After this lesson you can explain</b><ul>${l.goals.map((g) => `<li>${g}</li>`).join('')}</ul></div>` : ''}
    <p class="depth-hint">Reading the intuitive version. Switch to <button class="btn btn-sm" data-set-depth="rigorous">Rigorous</button> for equations, edge cases and the stricter wording.</p>
  </header>
  <div class="lesson-body">${WC.lessonBody(l)}</div>
  <footer class="lesson-end">
    ${review.length ? `<h2 class="end-h">Retrieval practice from earlier lessons</h2><p class="muted small">Recalling an earlier idea after a gap is what makes it stick. Questions you missed come back first.</p>${review.map((q) => `<div class="check" data-q="${q.id}" data-from="1"></div>`).join('')}` : ''}
    <label class="check-row" style="font-size:1rem;margin-top:1.2rem"><input type="checkbox" id="done-${l.id}" ${WC.state.done[l.id] ? 'checked' : ''}> <span><strong>I could explain this lesson to a skeptical PI.</strong> <span class="muted">Marks it understood in your progress.</span></span></label>
    <div class="lesson-notes"><label for="${noteId}"><h3 class="lab" style="margin-top:1rem">My notes on this lesson</h3></label><textarea id="${noteId}" placeholder="What would you say if a PI asked about this?">${esc(WC.state.notes.lesson[l.id] || '')}</textarea></div>
    <div data-capture-box style="margin-top:.8rem"><label class="small muted" for="cap-${l.id}">Quick capture with this lesson as context</label><div class="nb-add" style="margin-top:.3rem"><input id="cap-${l.id}" type="text" placeholder="A question, a doubt, an edit…"></div><div class="capture">${Object.keys(WC.LISTS).map((k) => `<button class="btn btn-sm" data-capture="${k}">+ ${esc(WC.LISTS[k][0])}</button>`).join('')}</div></div>
    <nav class="pager" aria-label="Lesson pagination">${prev ? `<a href="#l-${prev.id}"><small>← Lesson ${i}</small>${esc(prev.short || prev.title)}</a>` : '<span></span>'}${next ? `<a class="next" href="#l-${next.id}"><small>Lesson ${i + 2} →</small>${esc(next.short || next.title)}</a>` : `<a class="next" href="#defense"><small>Next →</small>Oral defense practice</a>`}</nav>
  </footer>
</article>`;
    $(`#done-${l.id}`).addEventListener('change', (e) => { if (e.target.checked) WC.state.done[l.id] = Date.now(); else delete WC.state.done[l.id]; WC.save(); });
    $(`#${noteId}`).addEventListener('input', (e) => { WC.state.notes.lesson[l.id] = e.target.value; WC.saveSoon(); });
    $('[data-set-depth]', view).addEventListener('click', () => WC.setDepth('rigorous'));
    mountAll(view);
  }
  function mountAll(root) {
    WC.renderChecks(root);
    const cleanups = [];
    $$('[data-widget]', root).forEach((el) => {
      const fn = WC.widgets[el.dataset.widget];
      if (!fn) { el.innerHTML = `<p class="muted">Interactive “${esc(el.dataset.widget)}” is missing.</p>`; return; }
      let opts = {};
      try { opts = el.dataset.opts ? JSON.parse(el.dataset.opts) : {}; } catch (e) { opts = {}; }
      try { el.innerHTML = ''; const c = fn(el, opts); if (typeof c === 'function') cleanups.push(c); }
      catch (err) { el.innerHTML = `<p class="readout warn">This interactive failed to load (${esc(err.message)}). The rest of the lesson still works.</p>`; if (window.console) console.warn(err); }
    });
    WC.teardown = () => cleanups.forEach((c) => { try { c(); } catch (e) { /* ignore */ } });
  }
  WC.mountAll = mountAll;

  /* ---------- Search ---------- */
  let index = null;
  function buildIndex() {
    const items = [];
    WC.lessons.forEach((l) => items.push({ type: 'Lessons', title: `${WC.lessonNum(l.id)}. ${stripTags(l.title)}`, text: stripTags(`${l.lede || ''} ${(l.goals || []).join(' ')} ${WC.lessonBody(l)}`), hash: `#l-${l.id}`, w: 1 }));
    (WC.glossary || []).forEach((g) => items.push({ type: 'Glossary', title: g.term, text: stripTags(g.def), hash: `#glossary-${WC.slug(g.term)}`, w: 1.4 }));
    (WC.sentences || []).forEach((s) => items.push({ type: 'Proposal sentences', title: `${s.id} · ${s.text}`, text: `${s.text} ${s.plain} ${s.why} ${(WC.sentenceExtra[s.id] || {}).ch || ''}`, hash: `#s-${s.id}`, w: 1.2 }));
    (WC.refs || []).forEach((r, i) => items.push({ type: 'Papers', title: `[${i + 1}] ${r.authors} — ${r.title}`, text: stripTags(`${r.studied} ${r.system} ${r.found} ${r.why} ${r.not.join(' ')}`), hash: `#src-${i + 1}`, w: 1.3 }));
    (WC.refNotes || []).forEach((n) => { const t = stripTags(n.html); items.push({ type: 'Refinement notes', title: `Refinement notes §${n.id}: ${t.slice(0, 70)}`, text: t, hash: '#notes', w: 0.9 }); });
    (WC.oral || []).forEach((o) => items.push({ type: 'Defense questions', title: o.q, text: stripTags(`${o.model} ${(o.weak || []).join(' ')}`), hash: `#defense`, oral: o.id, w: 1 }));
    items.forEach((it) => { it.lt = it.title.toLowerCase(); it.lx = it.text.toLowerCase(); });
    return items;
  }
  function search(q) {
    index = index || buildIndex();
    const toks = q.toLowerCase().split(/\s+/).filter((t) => t.length > 1 || /θ/.test(t));
    if (!toks.length) return [];
    const out = [];
    for (const it of index) {
      let s = 0, ok = true;
      for (const t of toks) {
        const inT = it.lt.includes(t), inX = it.lx.includes(t);
        if (!inT && !inX) { ok = false; break; }
        s += (inT ? 6 : 0) + (inX ? 1 + Math.min(3, it.lx.split(t).length - 1) * .3 : 0);
      }
      if (ok) out.push({ it, s: s * it.w });
    }
    return out.sort((a, b) => b.s - a.s).slice(0, 40).map((x) => x.it);
  }
  function snippet(it, q) {
    const t = q.toLowerCase().split(/\s+/).filter(Boolean)[0] || '';
    const i = it.lx.indexOf(t);
    const start = Math.max(0, i - 60);
    let s = (start > 0 ? '…' : '') + it.text.slice(start, start + 170) + '…';
    s = esc(s);
    q.split(/\s+/).filter((w) => w.length > 1).forEach((w) => { s = s.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>'); });
    return s;
  }
  function openSearch() {
    closeRail();
    const back = WC.modal('Search', '<div id="s-results" role="listbox" aria-label="Search results"><p class="muted small">Search lessons, the glossary, all 61 proposal sentences, the eight papers and the defense questions. Try “equal charge”, “companion”, “θ”, “pseudoreplication” or “Song”.</p></div>', {
      head: `<label class="sr-only" for="s-input">Search the guide</label><span class="gl mono" aria-hidden="true">⌕</span><input id="s-input" class="search-input" type="search" placeholder="Search everything…" autocomplete="off" aria-controls="s-results">`,
      focus: '#s-input',
    });
    const input = $('#s-input', back), res = $('#s-results', back);
    let sel = 0, hits = [];
    const draw = () => {
      const q = input.value.trim();
      hits = q ? search(q) : [];
      if (!q) return;
      if (!hits.length) { res.innerHTML = `<p class="muted">No matches for “${esc(q)}”. Try a shorter word.</p>`; return; }
      const groups = {};
      hits.forEach((h, i) => { (groups[h.type] = groups[h.type] || []).push([h, i]); });
      res.innerHTML = Object.entries(groups).map(([g, arr]) => `<div class="s-group"><h3 class="lab">${esc(g)}</h3>${arr.map(([h, i]) => `<button class="s-hit" role="option" id="hit-${i}" data-i="${i}" aria-selected="${i === sel}"><b>${esc(h.title.length > 140 ? h.title.slice(0, 140) + '…' : h.title)}</b><span>${snippet(h, q)}</span></button>`).join('')}</div>`).join('');
      input.setAttribute('aria-activedescendant', `hit-${sel}`);
    };
    const choose = (i) => {
      const h = hits[i]; if (!h) return;
      WC.closeModal();
      if (h.type === 'Lessons') WC.pendingFind = input.value.trim();
      if (h.oral) WC.pendingOral = h.oral;
      WC.go2(h.hash);
    };
    input.addEventListener('input', () => { sel = 0; draw(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(hits.length - 1, sel + 1); draw(); const b = $(`#hit-${sel}`, back); b && b.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); const b = $(`#hit-${sel}`, back); b && b.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter') { e.preventDefault(); choose(sel); }
    });
    res.addEventListener('click', (e) => { const b = e.target.closest('.s-hit'); if (b) choose(+b.dataset.i); });
  }
  WC.openSearch = openSearch;
  /* Find a phrase inside the rendered view, opening hidden concept tabs if needed. */
  function findInView(q) {
    const words = q.toLowerCase().split(/\s+/).filter((w) => w.length > 1);
    if (!words.length) return;
    const body = $('.lesson-body') || $('#view');
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let node, target = null;
    while ((node = walker.nextNode())) {
      const t = node.nodeValue.toLowerCase();
      if (t.includes(words[0])) {
        const el = node.parentElement;
        if (el.closest('.rig') && WC.state.depth !== 'rigorous') { if (!target) target = { el, rig: true }; continue; }
        target = { el, rig: false }; break;
      }
    }
    if (!target) return;
    if (target.rig) { WC.setDepth('rigorous'); toast('Match is in the rigorous version, now shown'); }
    const panel = target.el.closest('[role="tabpanel"]');
    if (panel && panel.hidden) { const tab = document.getElementById(panel.getAttribute('aria-labelledby')); tab && WC.selectTab(tab); }
    const det = target.el.closest('details'); if (det) det.open = true;
    target.el.scrollIntoView({ block: 'center' });
    target.el.classList.add('flash');
    setTimeout(() => target.el.classList.remove('flash'), 2300);
  }

  /* ---------- Keyboard ---------- */
  function showKeys() {
    WC.modal('Keyboard shortcuts', `<table><tbody>
      <tr><td><kbd>/</kbd> or <kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>Search everything</td></tr>
      <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td>Previous / next lesson</td></tr>
      <tr><td><kbd>j</kbd> <kbd>k</kbd></td><td>Next / previous sentence (sentence view)</td></tr>
      <tr><td><kbd>d</kbd></td><td>Toggle intuitive / rigorous depth</td></tr>
      <tr><td><kbd>t</kbd></td><td>Cycle theme (auto, light, dark)</td></tr>
      <tr><td><kbd>n</kbd></td><td>Open notebook</td></tr>
      <tr><td><kbd>g</kbd> then <kbd>h</kbd></td><td>Go to the start page</td></tr>
      <tr><td><kbd>?</kbd></td><td>This list</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>Close dialogs and popovers</td></tr></tbody></table>`);
  }
  let gPending = false;
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if ($('#modal-back')) return;
    const r = WC.route || {};
    if (gPending) { gPending = false; if (e.key === 'h') { WC.go2('#home'); return; } }
    switch (e.key) {
      case '/': e.preventDefault(); openSearch(); break;
      case '?': showKeys(); break;
      case 'd': WC.setDepth(WC.state.depth === 'rigorous' ? 'intuitive' : 'rigorous'); toast(`Depth: ${WC.state.depth}`); break;
      case 't': WC.cycleTheme(); break;
      case 'n': WC.go2('#notebook'); break;
      case 'g': gPending = true; setTimeout(() => { gPending = false; }, 900); break;
      case '[': case ']': {
        if (r.kind !== 'lesson') return;
        const i = WC.lessonIndex(r.id) + (e.key === ']' ? 1 : -1);
        if (WC.lessons[i]) WC.go2(`#l-${WC.lessons[i].id}`);
        break;
      }
      default:
    }
  });

  /* ---------- Export / import ---------- */
  WC.exportJSON = () => JSON.stringify(Object.assign({ exported: new Date().toISOString(), app: 'The Working Catalyst study guide' }, WC.state), null, 2);
  WC.exportMarkdown = function () {
    const s = WC.state, L = [];
    L.push('# The Working Catalyst — study notes', '', `Exported ${new Date().toLocaleString()}`, '');
    const done = WC.lessons.filter((l) => s.done[l.id]).length;
    L.push(`Lessons marked understood: ${done} of ${WC.lessons.length}`, '');
    for (const [k, [name]] of Object.entries(WC.LISTS)) {
      const items = s.lists[k] || [];
      L.push(`## ${name}`, '');
      if (!items.length) L.push('_None yet._');
      items.forEach((it) => L.push(`- [${it.done ? 'x' : ' '}] ${it.text}${it.ctx ? `  \n  _(${it.ctx})_` : ''}`));
      L.push('');
    }
    L.push('## Lesson notes', '');
    WC.lessons.forEach((l) => { const t = s.notes.lesson[l.id]; if (t && t.trim()) L.push(`### ${WC.lessonNum(l.id)}. ${stripTags(l.title)}`, '', t.trim(), ''); });
    L.push('## Notes on proposal sentences', '');
    (WC.sentences || []).forEach((x) => { const t = s.notes.sentence[x.id]; if (t && t.trim()) L.push(`### ${x.id}`, '', `> ${x.text}`, '', t.trim(), ''); });
    L.push('## Notes on papers', '');
    (WC.refs || []).forEach((r, i) => { const t = s.notes.paper[i + 1]; if (t && t.trim()) L.push(`### [${i + 1}] ${r.authors}, ${r.journal}`, '', t.trim(), ''); });
    L.push('## Oral-defense answers', '');
    (WC.oral || []).forEach((o) => { const a = s.oral[o.id]; if (a && a.answer && a.answer.trim()) L.push(`### ${o.q}`, '', a.answer.trim(), '', a.rating ? `_Self-rating: ${a.rating}_` : '', ''); });
    L.push('## Teach-back drafts', '');
    (WC.teachPrompts || []).forEach((p) => { const t = s.teach[p.id]; if (t && t.trim()) L.push(`### ${p.title}`, '', t.trim(), ''); });
    L.push('## Concepts', '');
    (WC.concepts || []).forEach((c) => { const st = WC.conceptStatus(c.id); L.push(`- ${st.status === 'm' ? '✓ mastered' : st.status === 'r' ? '↻ review' : '· not yet assessed'} — ${c.label}`); });
    return L.join('\n');
  };
  WC.download = function (name, text, type) {
    try {
      const blob = new Blob([text], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) { /* the copy fallback below covers sandboxes that block downloads */ }
  };
  WC.copy = function (text, area) {
    const fallback = () => { if (area) { area.focus(); area.select(); } toast('Copy blocked here: the text is selected, press Ctrl/⌘ C'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'), fallback);
      else fallback();
    } catch (e) { fallback(); }
  };
  WC.showExport = function (kind) {
    const md = kind === 'md';
    const text = md ? WC.exportMarkdown() : WC.exportJSON();
    const name = md ? 'working-catalyst-study-notes.md' : 'working-catalyst-backup.json';
    const back = WC.modal(md ? 'Export study notes (Markdown)' : 'Export full backup (JSON)', `<p class="small">${md ? 'Clean, readable notes: lists, lesson notes, sentence and paper notes, defense answers and teach-back drafts.' : 'Everything: progress, quiz history, notes and lists. Import it later or on another browser to restore.'}</p><div class="btn-row"><button class="btn btn-primary" id="ex-dl">Download ${name}</button><button class="btn" id="ex-copy">Copy to clipboard</button></div><label class="sr-only" for="ex-area">Export text</label><textarea id="ex-area" readonly style="min-height:16rem;font-family:var(--f-mono);font-size:.78rem">${esc(text)}</textarea><p class="muted small">If your browser blocks downloads (some embedded viewers do), copy the text instead.</p>`);
    $('#ex-dl', back).addEventListener('click', () => { WC.download(name, text, md ? 'text/markdown' : 'application/json'); toast('Download started (if your browser allows it)'); });
    $('#ex-copy', back).addEventListener('click', () => WC.copy(text, $('#ex-area', back)));
  };
  WC.importFile = function (file) {
    const fr = new FileReader();
    fr.onload = () => {
      let data;
      try { data = JSON.parse(fr.result); } catch (e) { toast('That file is not valid JSON. Choose a backup exported from this guide.'); return; }
      if (!data || data.v !== 2 || typeof data.lists !== 'object') { toast('That JSON is not a backup from this guide (missing version 2 fields).'); return; }
      const back = WC.modal('Restore backup?', `<p>This backup has ${Object.keys(data.done || {}).length} lessons marked understood, ${Object.values(data.lists || {}).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0)} list items and ${Object.keys((data.notes || {}).lesson || {}).length} lesson notes.</p><p><strong>Replace</strong> overwrites everything here. <strong>Merge</strong> keeps your current notes and adds the backup’s list items and any notes you don’t already have.</p><div class="btn-row"><button class="btn btn-primary" id="im-merge">Merge</button><button class="btn" id="im-replace">Replace everything</button><button class="btn btn-ghost" data-close>Cancel</button></div>`);
      $('#im-replace', back).addEventListener('click', () => { WC.state = WC.normalize(data); finish(); });
      $('#im-merge', back).addEventListener('click', () => {
        const inc = WC.normalize(data), s = WC.state;
        for (const k of Object.keys(s.lists)) { const ids = new Set(s.lists[k].map((x) => x.id)); inc.lists[k].forEach((x) => { if (!ids.has(x.id)) s.lists[k].push(x); }); }
        for (const g of ['lesson', 'sentence', 'paper']) for (const [k, v] of Object.entries(inc.notes[g] || {})) if (!s.notes[g][k]) s.notes[g][k] = v;
        for (const g of ['done', 'quiz', 'self', 'oral', 'teach', 'visited']) for (const [k, v] of Object.entries(inc[g] || {})) if (!(k in s[g])) s[g][k] = v;
        finish();
      });
      function finish() { WC.save(); WC.applyTheme(); WC.applyDepth(); WC.closeModal(); toast('Backup restored'); route(); }
    };
    fr.readAsText(file);
  };

  /* ---------- Boot ---------- */
  function boot() {
    shell();
    WC.applyTheme(); WC.applyDepth();
    window.addEventListener('hashchange', route);
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const h = () => WC.redrawCharts();
      mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    }
    route();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
