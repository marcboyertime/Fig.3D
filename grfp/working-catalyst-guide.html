<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="An offline interactive study guide to the NSF GRFP proposal “Learning to Make the Working Catalyst: Autonomous Synthesis–Activation Co-Design”.">
<title>The Working Catalyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: a lab notebook. A navigation rail of four parts, a ~68ch reading column,
   and on wide screens a margin column where reviewer questions, misconceptions and
   assumptions sit beside the sentence they qualify. Widgets break out across both. */
:root {
  --paper: #f4f5f2;
  --surface: #ffffff;
  --sunk: #eaece7;
  --ink: #182126;
  --ink-2: #3f4a50;
  --muted: #5d696e;
  --rule: #d6dbd4;
  --rule-strong: #aeb7b0;
  --copper: #974521;
  --copper-soft: #f5e4d8;
  --patina: #1b675f;
  --patina-soft: #d9ede8;
  --steel: #2c5b93;
  --steel-soft: #dfe9f5;
  --focus: #1f56c8;
  --hl: #fff1a8;
  --hl-ink: #182126;
  --shadow: 0 1px 2px rgba(24, 33, 38, .06), 0 8px 28px rgba(24, 33, 38, .06);
  --overlay: rgba(14, 22, 26, .48);

  /* Evidence categories — always paired with a glyph and a word */
  --st-est: #2a5b86;   --st-est-bg: #e1ecf6;
  --st-prop: #974521;  --st-prop-bg: #f6e5da;
  --st-hyp: #673d9b;   --st-hyp-bg: #eee6f7;
  --st-asm: #7e5800;   --st-asm-bg: #f7eed2;
  --st-pilot: #3b6526; --st-pilot-bg: #e4efdb;
  --st-sim: #4f5a63;   --st-sim-bg: #e9ecee;
  --st-unres: #9d2337; --st-unres-bg: #f8e1e5;
  --st-bgd: #4c5960;   --st-bgd-bg: #edf0ef;

  /* Chart series */
  --c-co: #974521;
  --c-n2: #2c5b93;
  --c-theta: #1b675f;
  --c-band: rgba(27, 103, 95, .16);
  --c-grid: #e1e5df;

  --f-display: "Newsreader", "Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --f-body: "Newsreader", "Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --rail: 288px;
  --measure: 68ch;
  --margin-col: 300px;
  --radius: 10px;
  --radius-sm: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1215; --surface: #141b1f; --sunk: #1a2327; --ink: #e8e5dd; --ink-2: #c3c8c6;
    --muted: #96a2a5; --rule: #273238; --rule-strong: #3d4a51; --copper: #e5996a; --copper-soft: #33231a;
    --patina: #74c8b6; --patina-soft: #132d29; --steel: #8fb6ea; --steel-soft: #16263a; --focus: #9ab7ff;
    --hl: #5b4a12; --hl-ink: #fff7d6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35); --overlay: rgba(0, 0, 0, .62);
    --st-est: #93bfe8; --st-est-bg: #142536; --st-prop: #eca47a; --st-prop-bg: #33221a;
    --st-hyp: #c7a7ef; --st-hyp-bg: #261c36; --st-asm: #e7c16a; --st-asm-bg: #2e2612;
    --st-pilot: #a9d38f; --st-pilot-bg: #1b2a14; --st-sim: #b5c0c7; --st-sim-bg: #1e262b;
    --st-unres: #f19aa9; --st-unres-bg: #351820; --st-bgd: #b8c3c6; --st-bgd-bg: #1b2327;
    --c-co: #e5996a; --c-n2: #8fb6ea; --c-theta: #74c8b6; --c-band: rgba(116, 200, 182, .18); --c-grid: #232d32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1215; --surface: #141b1f; --sunk: #1a2327; --ink: #e8e5dd; --ink-2: #c3c8c6;
  --muted: #96a2a5; --rule: #273238; --rule-strong: #3d4a51; --copper: #e5996a; --copper-soft: #33231a;
  --patina: #74c8b6; --patina-soft: #132d29; --steel: #8fb6ea; --steel-soft: #16263a; --focus: #9ab7ff;
  --hl: #5b4a12; --hl-ink: #fff7d6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35); --overlay: rgba(0, 0, 0, .62);
  --st-est: #93bfe8; --st-est-bg: #142536; --st-prop: #eca47a; --st-prop-bg: #33221a;
  --st-hyp: #c7a7ef; --st-hyp-bg: #261c36; --st-asm: #e7c16a; --st-asm-bg: #2e2612;
  --st-pilot: #a9d38f; --st-pilot-bg: #1b2a14; --st-sim: #b5c0c7; --st-sim-bg: #1e262b;
  --st-unres: #f19aa9; --st-unres-bg: #351820; --st-bgd: #b8c3c6; --st-bgd-bg: #1b2327;
  --c-co: #e5996a; --c-n2: #8fb6ea; --c-theta: #74c8b6; --c-band: rgba(116, 200, 182, .18); --c-grid: #232d32;
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 18px/1.62 var(--f-body); font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
a { color: var(--patina); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
img { max-width: 100%; }
h1, h2, h3, h4 { font-family: var(--f-display); color: var(--ink); text-wrap: balance; margin: 0; font-weight: 500; }
h1 { font-size: clamp(2.1rem, 1.4rem + 2.4vw, 3.3rem); line-height: 1.06; letter-spacing: -.015em; }
h2 { font-size: clamp(1.55rem, 1.2rem + 1vw, 2rem); line-height: 1.15; letter-spacing: -.01em; margin: 2.4rem 0 .8rem; }
h3 { font-size: 1.25rem; line-height: 1.25; margin: 1.6rem 0 .5rem; }
h2.lab, h3.lab, h4 { font: 600 .78rem/1.3 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1.2rem 0 .5rem; }
p { margin: 0 0 1rem; }
ul, ol { margin: 0 0 1rem; padding-left: 1.3rem; }
li { margin: .25rem 0; }
li::marker { color: var(--muted); }
strong { font-weight: 650; }
em { font-style: italic; }
sub, sup { line-height: 0; }
code, kbd, .mono { font-family: var(--f-mono); font-size: .86em; }
kbd { border: 1px solid var(--rule-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; background: var(--surface); font-size: .78em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 100; background: var(--surface); padding: .6rem 1rem; border-radius: 6px; font-family: var(--f-ui); }
.skip:focus { left: 12px; }
.ui { font-family: var(--f-ui); }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  border-right: 1px solid var(--rule); background: var(--surface); font-family: var(--f-ui);
}
.brand { display: flex; gap: .75rem; align-items: center; padding: 1.1rem 1.1rem .9rem; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.brand-mark {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 8px;
  background: var(--copper); color: var(--surface); font: 600 15px/1 var(--f-mono); position: relative;
}
.brand-mark small { position: absolute; right: 3px; top: 3px; font-size: 7px; opacity: .85; }
.brand b { display: block; font: 600 .95rem/1.2 var(--f-ui); }
.brand-txt > span { display: block; font: 400 .72rem/1.3 var(--f-mono); color: var(--muted); letter-spacing: .02em; }
.rail-scroll { overflow-y: auto; flex: 1; padding: .5rem .5rem 1rem; overscroll-behavior: contain; }
.rail-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: .5rem .25rem .75rem; border-bottom: 1px solid var(--rule); margin-bottom: .4rem; }
.rail-tools a { display: flex; align-items: center; gap: .45rem; padding: .45rem .55rem; border-radius: 6px; font-size: .8rem; color: var(--ink-2); text-decoration: none; }
.rail-tools a:hover, .rail-tools a[aria-current="page"] { background: var(--sunk); color: var(--ink); }
.rail-tools a .gl { font-family: var(--f-mono); font-size: .8rem; color: var(--copper); width: 1.1em; text-align: center; }
.part-group { margin: .2rem 0 .6rem; }
.part-head {
  display: flex; align-items: baseline; gap: .5rem; width: 100%; padding: .55rem .6rem .35rem; border: 0; background: none;
  text-align: left; font: 600 .68rem/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.part-head .pn { color: var(--copper); }
.part-head .chev { margin-left: auto; transition: transform .15s; }
.part-group.collapsed .chev { transform: rotate(-90deg); }
.part-group.collapsed ol { display: none; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li { margin: 0; }
.rail li a {
  display: grid; grid-template-columns: 1.9rem 1fr auto; align-items: baseline; gap: .1rem; padding: .36rem .6rem; border-radius: 6px;
  color: var(--ink-2); text-decoration: none; font-size: .84rem; line-height: 1.3;
}
.rail li a:hover { background: var(--sunk); color: var(--ink); }
.rail li a[aria-current="page"] { background: var(--copper-soft); color: var(--ink); font-weight: 550; }
.rail li a .ln { font: 500 .7rem/1 var(--f-mono); color: var(--muted); }
.rail li a .done { font-size: .72rem; color: var(--patina); }
.rail-foot { border-top: 1px solid var(--rule); padding: .8rem 1rem 1rem; font-size: .76rem; color: var(--muted); }
.meter { height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; margin: .4rem 0 .3rem; }
.meter > span { display: block; height: 100%; background: var(--patina); transition: width .3s; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .6rem;
  min-height: 56px; padding: .4rem clamp(16px, 3vw, 40px); background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); font-family: var(--f-ui);
}
.crumbs { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: .45rem; font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { opacity: .6; }
.tb-btn {
  display: inline-flex; align-items: center; gap: .4rem; min-height: 36px; padding: .35rem .65rem; border-radius: 8px;
  border: 1px solid var(--rule); background: var(--surface); font-size: .8rem; color: var(--ink-2);
}
.tb-btn:hover { border-color: var(--rule-strong); color: var(--ink); }
.tb-btn .gl { font-family: var(--f-mono); }
.depth-toggle { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.depth-toggle button { border: 0; background: none; padding: .38rem .7rem; font-size: .78rem; color: var(--muted); min-height: 34px; }
.depth-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.menu-btn { display: none; }

.view { width: 100%; padding: clamp(1.4rem, 3vw, 3rem) clamp(16px, 4vw, 56px) 5rem; }
.view:focus { outline: none; }

/* ---------- Lesson layout ---------- */
.lesson { max-width: calc(var(--measure) + 2rem); }
.lesson-head { margin-bottom: 1.6rem; }
.kicker { font: 500 .74rem/1.4 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--copper); display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-bottom: .7rem; }
.kicker .k-part { color: var(--muted); }
.lede { font-size: 1.18rem; line-height: 1.55; color: var(--ink-2); margin: .9rem 0 1.1rem; max-width: 60ch; }
.goals { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .8rem 0; margin: 1.2rem 0 1.6rem; font-family: var(--f-ui); font-size: .86rem; }
.goals b { font: 600 .68rem/1.4 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: .35rem; }
.goals ul { margin: 0; padding-left: 1.1rem; }
.goals li { margin: .15rem 0; }
.lesson-body > p, .lesson-body > ul, .lesson-body > ol { max-width: var(--measure); }
.lesson-body h2 { scroll-margin-top: 80px; }
.lesson-body h2 .h-num { font: 500 .8rem/1 var(--f-mono); color: var(--copper); margin-right: .55rem; vertical-align: .25em; }
.rig { display: none; }
[data-depth="rigorous"] .rig { display: block; }
[data-depth="rigorous"] span.rig { display: inline; }
[data-depth="rigorous"] .simple-only { display: none; }
.rig-tag { display: inline-block; font: 600 .62rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: .25rem .4rem; border-radius: 4px; background: var(--ink); color: var(--paper); margin-bottom: .5rem; }
.rig-block { border-left: 2px solid var(--ink); padding: .2rem 0 .2rem 1rem; margin: 1.2rem 0; max-width: var(--measure); }
.depth-hint { font: .8rem/1.5 var(--f-ui); color: var(--muted); margin: -.3rem 0 1rem; }
[data-depth="rigorous"] .depth-hint { display: none; }

@media (min-width: 1360px) {
  .lesson { max-width: calc(var(--measure) + var(--margin-col) + 3rem); }
  .lesson-body { padding-right: calc(var(--margin-col) + 2.5rem); position: relative; }
  .lesson-body > .side {
    float: right; clear: right; width: var(--margin-col); margin: .2rem calc(-1 * (var(--margin-col) + 2.5rem)) 1rem 0;
    font-size: .92rem;
  }
  .lesson-body > .wide { margin-right: calc(-1 * (var(--margin-col) + 2.5rem)); }
  .lesson-body > h2, .lesson-body > .wide, .lesson-body > .concept, .lesson-body > .table-wrap { clear: both; }
}

/* ---------- Evidence badges ---------- */
.ev {
  display: inline-flex; align-items: center; gap: .32em; padding: .14em .5em .14em .4em; border-radius: 999px;
  font: 600 .66rem/1.35 var(--f-ui); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; vertical-align: .12em;
  border: 1px solid currentColor;
}
.ev i { font-style: normal; font-family: var(--f-mono); font-weight: 700; font-size: .95em; }
.ev-est { color: var(--st-est); background: var(--st-est-bg); }
.ev-prop { color: var(--st-prop); background: var(--st-prop-bg); }
.ev-hyp { color: var(--st-hyp); background: var(--st-hyp-bg); }
.ev-asm { color: var(--st-asm); background: var(--st-asm-bg); }
.ev-pilot { color: var(--st-pilot); background: var(--st-pilot-bg); }
.ev-sim { color: var(--st-sim); background: var(--st-sim-bg); border-style: dashed; }
.ev-unres { color: var(--st-unres); background: var(--st-unres-bg); }
.ev-bgd { color: var(--st-bgd); background: var(--st-bgd-bg); border-style: dotted; }
.ev-lit { color: var(--st-est); background: var(--st-est-bg); }
.ev-meth { color: var(--patina); background: var(--patina-soft); }
.ev-feas { color: var(--st-pilot); background: var(--st-pilot-bg); }
.ev-bi { color: var(--st-bgd); background: var(--st-bgd-bg); }

/* Claim statements tagged with a category */
.claim { display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); gap: .2rem .8rem; align-items: start; padding: .75rem 0; border-top: 1px solid var(--rule); max-width: var(--measure); }
.claim:last-of-type { border-bottom: 1px solid var(--rule); }
.claim .ev { margin-top: .3rem; white-space: normal; justify-self: start; }
@media (max-width: 640px) { .claim { grid-template-columns: 1fr; } }
.claim p { margin: 0; }
.claims { margin: 1rem 0 1.5rem; }

/* ---------- Callouts ---------- */
.call {
  --c: var(--ink-2); --cb: var(--sunk);
  border-left: 3px solid var(--c); background: var(--cb); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: .85rem 1rem .9rem 1.05rem; margin: 1.2rem 0; max-width: var(--measure); font-size: .95rem; line-height: 1.55;
}
.call > .call-t { display: flex; gap: .45rem; align-items: baseline; font: 600 .72rem/1.3 var(--f-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--c); margin-bottom: .35rem; }
.call > .call-t i { font-style: normal; font-family: var(--f-mono); }
.call p:last-child, .call ul:last-child { margin-bottom: 0; }
.call h5 { font: 600 1rem/1.3 var(--f-display); margin: 0 0 .3rem; }
.call-care { --c: var(--patina); --cb: var(--patina-soft); }
.call-mis { --c: var(--st-unres); --cb: var(--st-unres-bg); }
.call-rev { --c: var(--st-hyp); --cb: var(--st-hyp-bg); }
.call-asm { --c: var(--st-asm); --cb: var(--st-asm-bg); }
.call-dist { --c: var(--steel); --cb: var(--steel-soft); }
.call-unres { --c: var(--st-unres); --cb: var(--surface); border: 1px dashed var(--st-unres); border-left-width: 3px; }
.call-bgd { --c: var(--st-bgd); --cb: var(--surface); border: 1px dotted var(--rule-strong); border-left: 3px dotted var(--st-bgd); }
.call-key { --c: var(--copper); --cb: var(--copper-soft); }
.call-note { --c: var(--ink-2); --cb: var(--sunk); }
.call details summary { cursor: pointer; font-family: var(--f-ui); font-size: .85rem; color: var(--c); }
.side.call { margin-top: .2rem; }

/* ---------- Chips & links ---------- */
.chip {
  display: inline-flex; align-items: center; gap: .3rem; padding: .12rem .5rem; border-radius: 5px; border: 1px solid var(--rule);
  background: var(--surface); font: 500 .74rem/1.5 var(--f-mono); color: var(--ink-2); text-decoration: none; vertical-align: .08em; cursor: pointer;
}
.chip:hover { border-color: var(--copper); color: var(--copper); }
.chip-src::before { content: "¶"; color: var(--copper); }
.chip-ref { color: var(--st-est); }
.chip-ref::before { content: "◆"; font-size: .7em; }
.chip-go::after { content: "→"; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin: .4rem 0 1rem; }
.term { border: 0; background: none; padding: 0; color: inherit; font: inherit; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: help; }
.term:hover { color: var(--patina); text-decoration-color: var(--patina); }
.popover {
  position: fixed; z-index: 70; max-width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--rule-strong);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: .9rem 1rem; font: .86rem/1.5 var(--f-ui);
}
.popover b { font: 600 1rem/1.3 var(--f-display); display: block; margin-bottom: .3rem; }
.popover .pop-actions { display: flex; gap: .5rem; margin-top: .6rem; }

/* ---------- Buttons & form controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 40px; padding: .5rem .95rem; border-radius: 8px;
  border: 1px solid var(--rule-strong); background: var(--surface); font: 500 .86rem/1.2 var(--f-ui); color: var(--ink); text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-2); }
.btn-copper { background: var(--copper); border-color: var(--copper); color: var(--surface); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-sm { min-height: 32px; padding: .3rem .6rem; font-size: .78rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .8rem 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 9px; background: var(--sunk); font-family: var(--f-ui); }
.seg button { border: 0; background: none; padding: .38rem .7rem; border-radius: 7px; font-size: .8rem; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
label.ctl { display: grid; gap: .3rem; font: .8rem/1.3 var(--f-ui); color: var(--ink-2); }
label.ctl .ctl-row { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
label.ctl output { font: 600 .82rem/1 var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--copper); min-height: 28px; }
input[type="number"], input[type="text"], input[type="search"], select, textarea {
  width: 100%; border: 1px solid var(--rule-strong); border-radius: 7px; background: var(--surface); padding: .5rem .6rem; font: .9rem/1.4 var(--f-ui); color: var(--ink);
}
textarea { min-height: 7rem; resize: vertical; line-height: 1.55; font-family: var(--f-ui); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--copper); width: 1.05rem; height: 1.05rem; }
.check-row { display: flex; gap: .55rem; align-items: flex-start; font: .88rem/1.45 var(--f-ui); padding: .35rem 0; }
.check-row input { margin-top: .15rem; flex: none; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .9rem 1.2rem; margin: 1rem 0; }

/* ---------- Widgets ---------- */
.widget { margin: 1.6rem 0 2rem; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; justify-content: space-between; padding: .9rem 1.1rem .7rem; border-bottom: 1px solid var(--rule); }
.panel-head .p-title { margin: 0; font-size: 1.15rem; line-height: 1.25; letter-spacing: 0; }
.panel-head .ev { margin-left: auto; }
.panel-body { padding: 1rem 1.1rem 1.1rem; font-family: var(--f-ui); font-size: .9rem; line-height: 1.5; }
.panel-body p { max-width: 72ch; }
.panel-foot { padding: .7rem 1.1rem; border-top: 1px solid var(--rule); background: var(--sunk); font: .78rem/1.5 var(--f-ui); color: var(--muted); }
.sim-banner { display: flex; gap: .5rem; align-items: center; padding: .45rem 1.1rem; background: var(--st-sim-bg); color: var(--st-sim); font: 600 .7rem/1.4 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; border-bottom: 1px dashed var(--st-sim); }
.sim-banner i { font-style: normal; font-family: var(--f-mono); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.4rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; }
.stat { border: 1px solid var(--rule); border-radius: 8px; padding: .65rem .75rem; background: var(--paper); min-width: 0; }
.stat small { display: block; font: 500 .68rem/1.3 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; font: 600 1.3rem/1.25 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: .15rem; }
.stat span { display: block; font-size: .76rem; color: var(--muted); margin-top: .15rem; }
.stat.hi { border-color: var(--copper); background: var(--copper-soft); }
.stat.ok { border-color: var(--patina); background: var(--patina-soft); }
.readout { border-left: 3px solid var(--patina); padding: .55rem .8rem; background: var(--patina-soft); border-radius: 0 6px 6px 0; margin: .8rem 0; font-size: .9rem; }
.readout:empty { display: none; }
.readout.warn { border-color: var(--st-unres); background: var(--st-unres-bg); }
.readout.neutral { border-color: var(--rule-strong); background: var(--sunk); }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.svg-text { fill: var(--muted); font: 11px var(--f-mono); }
.svg-label { fill: var(--ink-2); font: 12px var(--f-ui); }
.svg-title { fill: var(--ink); font: 600 13px var(--f-ui); }
.axis { stroke: var(--rule-strong); stroke-width: 1; fill: none; }
.gridline { stroke: var(--c-grid); stroke-width: 1; fill: none; }
.legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font: .78rem/1.3 var(--f-ui); color: var(--ink-2); margin: .4rem 0; }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend .sw { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .sw.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }
.table-wrap { overflow-x: auto; margin: 1.2rem 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font: .85rem/1.45 var(--f-ui); }
th, td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--rule); }
th { font: 600 .7rem/1.3 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Concept tabs */
.concept { margin: 1.6rem 0 2rem; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.concept-head { padding: .85rem 1.1rem .2rem; display: flex; gap: .7rem; align-items: baseline; flex-wrap: wrap; }
.concept-head .c-title { margin: 0; font-size: 1.2rem; line-height: 1.25; letter-spacing: 0; }
.concept-head .c-lab { font: 600 .66rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--copper); }
.concept [role="tablist"] { display: flex; gap: 0; padding: 0 .6rem; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: thin; }
.concept [role="tab"] { flex: none; border: 0; background: none; padding: .6rem .6rem .55rem; font: 500 .78rem/1.2 var(--f-ui); color: var(--muted); border-bottom: 2px solid transparent; min-height: 40px; }
.concept [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--copper); font-weight: 600; }
.concept [role="tab"] .tn { font-family: var(--f-mono); font-size: .68rem; margin-right: .3rem; color: var(--copper); }
.concept [role="tabpanel"] { padding: 1rem 1.1rem 1.1rem; font-size: 1rem; }
.concept [role="tabpanel"] > :last-child { margin-bottom: 0; }
.concept .c-nav { display: flex; justify-content: space-between; padding: 0 1.1rem .9rem; }

/* Equations */
.eq { margin: 1.1rem 0; padding: .9rem 1.1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius-sm); max-width: var(--measure); overflow-x: auto; }
.eq .math { font: 1.15rem/1.6 var(--f-display); font-style: italic; white-space: nowrap; }
.eq .math .up { font-style: normal; }
.eq .eq-read { font: .85rem/1.5 var(--f-ui); color: var(--muted); margin-top: .45rem; white-space: normal; }

/* Knowledge checks */
.check { margin: 1.6rem 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 1rem 1.1rem; max-width: calc(var(--measure) + 4rem); font-family: var(--f-ui); }
.check-lab { display: flex; gap: .6rem; align-items: center; font: 600 .68rem/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--patina); margin-bottom: .6rem; }
.check-lab .from { color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: none; }
.check-q { font: 500 1.05rem/1.45 var(--f-display); margin-bottom: .7rem; }
.check-opts { display: grid; gap: .4rem; }
.check-opts button {
  text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: .6rem .75rem; font-size: .88rem; line-height: 1.4;
  display: grid; grid-template-columns: 1.6rem 1fr; gap: .3rem; min-height: 44px;
}
.check-opts button:hover:not(:disabled) { border-color: var(--ink-2); }
.check-opts button .ol { font-family: var(--f-mono); color: var(--muted); }
.check-opts button.right { border-color: var(--patina); background: var(--patina-soft); }
.check-opts button.wrong { border-color: var(--st-unres); background: var(--st-unres-bg); }
.check-opts button:disabled { opacity: 1; cursor: default; }
.check-fb { margin-top: .7rem; font-size: .88rem; line-height: 1.5; }
.check-fb .verdict { font-weight: 650; }
.check-num { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.check-num input { width: 8rem; }

/* Lesson footer */
.lesson-end .end-h { font-size: 1.25rem; margin: 1.6rem 0 .4rem; }
.lesson-end { margin-top: 3rem; border-top: 1px solid var(--rule); padding-top: 1.4rem; font-family: var(--f-ui); max-width: calc(var(--measure) + 4rem); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: 1.4rem; }
.pager a { display: block; padding: .8rem 1rem; border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); }
.pager a:hover { border-color: var(--copper); }
.pager a small { display: block; font: .72rem/1.3 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.pager a.next { text-align: right; grid-column: 2; }
.lesson-notes { margin-top: 1.2rem; }
.lesson-notes textarea { min-height: 5.5rem; }
.capture { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }

/* Return chip */
.return-chip {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: .5rem; background: var(--ink); color: var(--paper); border-radius: 999px; padding: .5rem .5rem .5rem 1rem;
  font: .82rem/1.2 var(--f-ui); box-shadow: var(--shadow); max-width: calc(100vw - 32px);
}
.return-chip a { color: var(--paper); font-weight: 600; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.return-chip button { border: 0; background: transparent; color: var(--paper); opacity: .7; width: 30px; height: 30px; border-radius: 50%; }

/* ---------- Modal / search ---------- */
.modal-back { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
.modal { width: min(760px, 100%); max-height: 84vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--rule); overflow: hidden; font-family: var(--f-ui); }
.modal-head { display: flex; align-items: center; gap: .6rem; padding: .7rem .9rem; border-bottom: 1px solid var(--rule); }
.modal-head h2 { margin: 0; font-size: 1.15rem; flex: 1; }
.modal-body { overflow-y: auto; padding: 1rem 1.1rem 1.2rem; }
.search-input { border: 0 !important; font-size: 1.05rem !important; padding: .4rem .2rem !important; background: transparent !important; }
.search-input:focus-visible { outline: none; }
.s-group { margin: .4rem 0 .9rem; }
.s-group h3.lab { margin: .3rem 0 .4rem; }
.s-hit { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: .5rem .6rem; font-size: .86rem; line-height: 1.4; }
.s-hit b { display: block; font-weight: 600; font-size: .9rem; color: var(--ink); }
.s-hit span { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.s-hit[aria-selected="true"], .s-hit:hover { background: var(--sunk); border-color: var(--rule); }
mark { background: var(--hl); color: var(--hl-ink); border-radius: 2px; padding: 0 .1em; }
.flash { animation: flash 2.2s ease-out; border-radius: 4px; }
@keyframes flash { 0%, 30% { background: var(--hl); } 100% { background: transparent; } }
.toast { position: fixed; z-index: 80; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: .6rem .9rem; border-radius: 8px; font: .85rem/1.3 var(--f-ui); box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* ---------- Home ---------- */
.home { max-width: 1180px; }
.home-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: center; margin-bottom: 2.4rem; }
.home-hero h1 { font-size: clamp(2.4rem, 1.5rem + 3vw, 4rem); }
.home-hero h1 em { color: var(--copper); font-style: italic; }
.home-q { font: italic 400 1.25rem/1.5 var(--f-display); color: var(--ink-2); border-left: 2px solid var(--copper); padding-left: 1rem; margin: 1.2rem 0; max-width: 54ch; }
.hero-fig { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 1rem; box-shadow: var(--shadow); }
.hero-fig figcaption { font: .76rem/1.45 var(--f-ui); color: var(--muted); margin-top: .5rem; }
.parts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0 2rem; }
.part-card { border-top: 2px solid var(--ink); padding-top: .8rem; font-family: var(--f-ui); min-width: 0; }
.part-card .pn { font: 600 .7rem/1 var(--f-mono); letter-spacing: .1em; color: var(--copper); }
.part-card h3 { margin: .35rem 0 .5rem; font-size: 1.15rem; }
.part-card p { font-size: .84rem; color: var(--ink-2); line-height: 1.5; }
.part-card ol { list-style: none; padding: 0; margin: 0; font-size: .82rem; }
.part-card li { margin: 0; border-top: 1px solid var(--rule); }
.part-card li a { display: flex; gap: .5rem; padding: .35rem 0; text-decoration: none; color: var(--ink-2); }
.part-card li a:hover { color: var(--copper); }
.part-card li .ln { font: .7rem var(--f-mono); color: var(--muted); min-width: 1.4rem; padding-top: .1rem; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .6rem 1.2rem; font: .84rem/1.45 var(--f-ui); }
.legend-grid > div { display: grid; gap: .3rem; padding: .6rem 0; border-top: 1px solid var(--rule); }
.tool-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem; margin: 1rem 0 2rem; }
.tool-card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: .9rem 1rem; font-family: var(--f-ui); }
.tool-card:hover { border-color: var(--copper); }
.tool-card b { display: block; font: 600 1.02rem/1.3 var(--f-display); margin-bottom: .25rem; }
.tool-card span { font-size: .82rem; color: var(--muted); line-height: 1.45; display: block; }

/* ---------- Sentence explorer ---------- */
.explorer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.6rem; align-items: start; max-width: 1320px; }
.explorer-filters { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; font-family: var(--f-ui); align-items: end; }
.explorer-filters label { display: grid; gap: .25rem; font-size: .74rem; color: var(--muted); min-width: 0; flex: 1 1 180px; }
.reading { font-size: 1.02rem; line-height: 1.7; }
.para-block { margin: 0 0 1.2rem; padding-bottom: .6rem; border-bottom: 1px solid var(--rule); }
.para-block .lab { margin: .2rem 0 .5rem; }
.sent { display: inline; text-decoration: none; border: 0; background: none; padding: .05em .1em; margin: 0 -.05em; font: inherit; text-align: left; color: var(--ink-2); border-radius: 3px; cursor: pointer; line-height: inherit; }
.sent:hover { background: var(--sunk); color: var(--ink); }
.sent[aria-current="true"] { background: var(--copper-soft); color: var(--ink); box-shadow: inset 0 -2px 0 var(--copper); }
.sent.dim { opacity: .35; }
.sent .sid { font: 500 .6rem/1 var(--f-mono); color: var(--muted); vertical-align: .5em; margin-right: .15em; }
.sent.has-note::after { content: "✎"; font-size: .7em; color: var(--patina); margin-left: .15em; vertical-align: .3em; }
.annot { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow-y: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); font-family: var(--f-ui); }
.annot-head { padding: 1rem 1.2rem .8rem; border-bottom: 1px solid var(--rule); }
.annot-head .meta { display: flex; flex-wrap: wrap; gap: .4rem .7rem; align-items: center; font: .74rem/1.3 var(--f-mono); color: var(--muted); }
.annot-orig { font: 400 1.18rem/1.5 var(--f-display); margin: .7rem 0 0; color: var(--ink); }
.annot-body { padding: .3rem 1.2rem 1rem; }
.annot-field { padding: .75rem 0; border-bottom: 1px solid var(--rule); font-size: .9rem; line-height: 1.55; }
.annot-field:last-child { border-bottom: 0; }
.annot-field h3.lab { margin: 0 0 .3rem; display: flex; gap: .4rem; align-items: baseline; }
.annot-field h3.lab i { font-style: normal; font-family: var(--f-mono); color: var(--copper); }
.annot-field p, .annot-field ul { margin: 0; }
.annot-nav { display: flex; gap: .5rem; justify-content: space-between; align-items: center; padding: .7rem 1.2rem; border-top: 1px solid var(--rule); background: var(--sunk); position: sticky; bottom: 0; }

/* ---------- Sources / glossary / notebook ---------- */
.paper { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); margin: 1rem 0 1.4rem; overflow: hidden; scroll-margin-top: 80px; }
.paper-head { display: grid; grid-template-columns: 2.6rem 1fr; gap: .8rem; padding: 1rem 1.1rem .8rem; border-bottom: 1px solid var(--rule); }
.paper-num { font: 600 1.1rem/1 var(--f-mono); color: var(--st-est); padding-top: .25rem; }
.paper-head .paper-title { margin: 0 0 .25rem; font-size: 1.12rem; line-height: 1.3; letter-spacing: 0; }
.paper-head .cite { font: .8rem/1.4 var(--f-ui); color: var(--muted); }
.paper-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; font: .88rem/1.55 var(--f-ui); }
.paper-grid > div { padding: .8rem 1.1rem; border-bottom: 1px solid var(--rule); min-width: 0; }
.paper-grid > div:nth-child(odd) { border-right: 1px solid var(--rule); }
.paper-grid h3.lab { margin: 0 0 .3rem; }
.paper-grid p:last-child, .paper-grid ul:last-child { margin-bottom: 0; }
.paper-not { background: var(--st-unres-bg); }
.paper-foot { padding: .8rem 1.1rem; font: .8rem/1.5 var(--f-ui); display: grid; gap: .6rem; }
.gloss-list { columns: 2 320px; column-gap: 2rem; font-family: var(--f-ui); }
.gloss-item { break-inside: avoid; padding: .7rem 0; border-top: 1px solid var(--rule); font-size: .88rem; line-height: 1.5; scroll-margin-top: 80px; }
.gloss-item b { font: 600 1.02rem/1.3 var(--f-display); display: block; margin-bottom: .2rem; }
.gloss-alpha { display: flex; flex-wrap: wrap; gap: .25rem; margin: .8rem 0 1rem; font-family: var(--f-mono); font-size: .78rem; }
.gloss-alpha a { padding: .15rem .4rem; border-radius: 4px; text-decoration: none; color: var(--ink-2); border: 1px solid var(--rule); }
.nb-tabs { margin: 1rem 0; }
.nb-list { list-style: none; padding: 0; margin: .6rem 0 1.2rem; font-family: var(--f-ui); }
.nb-list li { display: grid; grid-template-columns: auto 1fr auto; gap: .6rem; align-items: start; padding: .55rem 0; border-top: 1px solid var(--rule); font-size: .9rem; }
.nb-list li.done .nb-text { text-decoration: line-through; color: var(--muted); }
.nb-list .nb-ctx { display: block; font: .72rem/1.4 var(--f-mono); color: var(--muted); margin-top: .15rem; }
.nb-add { display: flex; gap: .5rem; }
.nb-add input { flex: 1; }
.note-card { border-top: 1px solid var(--rule); padding: .7rem 0; font-family: var(--f-ui); font-size: .88rem; }
.note-card h3.lab { margin: 0 0 .3rem; }
.note-card .note-text { white-space: pre-wrap; color: var(--ink-2); }
.conf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem 1rem; align-items: center; padding: .55rem 0; border-top: 1px solid var(--rule); font: .86rem/1.4 var(--f-ui); }
.conf-row .bar { grid-column: 1 / -1; height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.conf-row .bar span { display: block; height: 100%; background: var(--patina); }
.conf-row .self { display: inline-flex; gap: 2px; }
.conf-row .self button { border: 1px solid var(--rule); background: var(--surface); font: .7rem/1 var(--f-ui); padding: .35rem .45rem; border-radius: 5px; min-height: 30px; }
.conf-row .self button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.status-pill { display: inline-block; font: 600 .66rem/1 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; padding: .3rem .45rem; border-radius: 4px; }
.status-pill.m { background: var(--patina-soft); color: var(--patina); }
.status-pill.r { background: var(--st-unres-bg); color: var(--st-unres); }
.status-pill.n { background: var(--sunk); color: var(--muted); }

/* Oral defense */
.defense { max-width: 880px; }
.q-card { border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); padding: 1.3rem 1.4rem; box-shadow: var(--shadow); font-family: var(--f-ui); }
.q-card .q-text { font: 500 1.45rem/1.3 var(--f-display); margin: .5rem 0 1rem; text-wrap: balance; }
.q-meta { display: flex; flex-wrap: wrap; gap: .5rem 1rem; font: .74rem/1.3 var(--f-mono); color: var(--muted); }
.reveal-grid { display: grid; gap: 1rem; margin-top: 1rem; }
.reveal-grid section { border-top: 1px solid var(--rule); padding-top: .8rem; }
.concept-hit { display: flex; gap: .5rem; align-items: baseline; padding: .2rem 0; font-size: .88rem; }
.concept-hit .mk { font-family: var(--f-mono); width: 1.2rem; flex: none; }
.concept-hit.hit .mk { color: var(--patina); }
.concept-hit.miss .mk { color: var(--st-unres); }
.timer { font: 600 .9rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }

/* Original proposal */
.pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; max-width: 1200px; }
.pages figure { margin: 0; background: #fff; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.pages img { display: block; width: 100%; height: auto; }
:root[data-theme="dark"] .pages img { filter: invert(.9) hue-rotate(180deg); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pages img { filter: invert(.9) hue-rotate(180deg); } }
.pages figure { background: var(--surface); }
.proposal-text { max-width: var(--measure); font-size: 1.02rem; }
.proposal-text h3 { font-size: 1.1rem; margin-top: 1.4rem; }
.proposal-text .pid { font: .7rem var(--f-mono); color: var(--muted); margin-right: .4rem; }

/* Mobile bottom bar */
.bottom-bar { display: none; }

/* ---------- Diagram-specific ---------- */
.stage-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .5rem; }
.stage-card { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: .5rem; display: grid; gap: .3rem; text-align: left; min-width: 0; }
.stage-card[aria-pressed="true"] { border-color: var(--copper); box-shadow: 0 0 0 2px var(--copper-soft); }
.stage-card .st-n { font: 600 .66rem/1 var(--f-mono); color: var(--copper); letter-spacing: .06em; }
.stage-card .st-t { font: 600 .8rem/1.25 var(--f-ui); }
.stage-card svg { width: 100%; height: auto; display: block; border-radius: 4px; background: var(--surface); }
.term-list { display: flex; flex-wrap: wrap; gap: .35rem; margin: .6rem 0; }
.term-list button { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: .32rem .7rem; font: .8rem/1.2 var(--f-ui); min-height: 34px; }
.term-list button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dag-node { cursor: pointer; }
.dag-node rect { fill: var(--surface); stroke: var(--rule-strong); stroke-width: 1.2; }
.dag-node text { fill: var(--ink); font: 12px var(--f-ui); pointer-events: none; }
.dag-node.sel rect { stroke: var(--copper); stroke-width: 2.4; fill: var(--copper-soft); }
.dag-node:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.dag-node:focus { outline: none; }
.dag-edge { stroke: var(--rule-strong); stroke-width: 1.4; fill: none; }
.dag-edge.on { stroke: var(--copper); stroke-width: 2.6; }
.dag-edge.alt { stroke-dasharray: 5 4; }
.ladder { display: grid; gap: .6rem; }
.rung { display: grid; grid-template-columns: 3rem 1fr; gap: .8rem; align-items: start; border: 1px solid var(--rule); border-radius: 10px; padding: .8rem 1rem; background: var(--paper); text-align: left; width: 100%; }
.rung .rn { font: 600 1.5rem/1 var(--f-display); color: var(--muted); }
.rung.reached { border-color: var(--patina); background: var(--patina-soft); }
.rung.reached .rn { color: var(--patina); }
.rung h3.lab { margin: 0 0 .2rem; color: var(--ink); font-size: .78rem; }
.rung p { margin: 0; font-size: .86rem; color: var(--ink-2); }
.nest { font: .86rem/1.4 var(--f-ui); }
.nest-level { display: grid; grid-template-columns: 9.5rem 1fr; gap: .8rem; align-items: center; padding: .5rem 0; border-top: 1px solid var(--rule); }
.nest-level .dots { display: flex; flex-wrap: wrap; gap: 3px; }
.nest-level .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--rule-strong); }
.nest-level .dot.ind { background: var(--copper); border-radius: 50%; width: 14px; height: 14px; }
.station { cursor: pointer; }
.station rect { fill: var(--surface); stroke: var(--rule-strong); }
.station.sel rect { stroke: var(--copper); stroke-width: 2.4; fill: var(--copper-soft); }
.station.manual rect { stroke-dasharray: 5 3; }
.station text { fill: var(--ink); font: 11.5px var(--f-ui); pointer-events: none; }
.station:focus { outline: none; }
.station:focus-visible rect { stroke: var(--focus); stroke-width: 3; }
.replay-grid { display: grid; grid-template-columns: 7rem repeat(5, minmax(0, 1fr)); gap: 4px; font: .74rem/1.2 var(--f-ui); align-items: stretch; }
.replay-grid .rh { font: 600 .66rem/1.2 var(--f-mono); color: var(--muted); display: flex; align-items: center; }
.tile { border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); min-height: 52px; padding: .3rem; display: grid; align-content: center; justify-items: center; text-align: center; gap: 2px; font: .7rem/1.2 var(--f-mono); }
.tile:hover:not(:disabled) { border-color: var(--copper); }
.tile.bought { background: var(--patina-soft); border-color: var(--patina); }
.tile.val { background: repeating-linear-gradient(45deg, var(--sunk) 0 6px, var(--surface) 6px 12px); cursor: not-allowed; }
.tile.val.open { background: var(--st-hyp-bg); border-color: var(--st-hyp); cursor: default; }
.tile.empty { border-style: dashed; color: var(--muted); }
.tile.soldout { opacity: .65; }
.timeline-svg .lane-label { fill: var(--ink-2); font: 11px var(--f-ui); }
.log { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--rule); margin-top: .8rem; font: .8rem/1.45 var(--f-ui); }
.log div { padding: .35rem 0; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 3rem 1fr; gap: .5rem; }
.log div b { font-family: var(--f-mono); font-weight: 500; color: var(--copper); }
.action-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; margin: .8rem 0; }
.action-card { border: 1px solid var(--rule); border-radius: 9px; padding: .75rem .8rem; background: var(--paper); min-width: 0; display: grid; gap: .35rem; align-content: start; }
.action-card.best { border-color: var(--copper); background: var(--copper-soft); box-shadow: 0 0 0 1px var(--copper); }
.action-card h3.lab { margin: 0; color: var(--ink); font-size: .82rem; display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
.action-card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: .15rem .6rem; font-size: .78rem; }
.action-card dt { color: var(--muted); }
.action-card dd { margin: 0; font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.bar-u { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar-u span { display: block; height: 100%; background: var(--copper); }
.matrix { display: grid; grid-template-columns: 8.5rem repeat(2, minmax(0, 1fr)); gap: 6px; font-family: var(--f-ui); }
.matrix .mh { font: 600 .74rem/1.3 var(--f-ui); color: var(--muted); display: flex; align-items: end; padding: .2rem; }
.matrix .rlab { font: 600 .78rem/1.3 var(--f-ui); display: block; align-self: center; }
.cell { border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .6rem; background: var(--paper); display: grid; gap: .25rem; }
.cell.co { border-top: 3px solid var(--c-co); }
.cell.n2 { border-top: 3px solid var(--c-n2); }
.cell input[type="number"] { font: 600 1.05rem/1 var(--f-mono); padding: .35rem .45rem; }
.cell small { font-size: .7rem; color: var(--muted); }
.verdict-big { font: 500 1.15rem/1.4 var(--f-display); margin: .3rem 0; }
.predict-box { border: 1px dashed var(--rule-strong); border-radius: 9px; padding: .8rem .9rem; margin-top: 1rem; }

@media (max-width: 1100px) {
  :root { --rail: 260px; }
  .home-hero { grid-template-columns: 1fr; }
  .parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .explorer { grid-template-columns: 1fr; }
  .annot { position: relative; top: 0; max-height: none; }
  .action-cards { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  body { font-size: 17px; }
  .app { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: min(320px, 86vw); height: auto; transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
  .rail.open { transform: none; }
  .rail-shade { position: fixed; inset: 0; z-index: 45; background: var(--overlay); }
  .menu-btn { display: inline-flex; }
  .tb-hide-sm { display: none; }
  #theme-btn .lbl { display: none; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stage-strip { grid-template-columns: repeat(5, minmax(120px, 1fr)); overflow-x: auto; padding-bottom: .3rem; }
  .bottom-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); font-family: var(--f-ui);
  }
  .bottom-bar a, .bottom-bar button { display: grid; justify-items: center; gap: 2px; padding: .45rem .2rem .5rem; border: 0; background: none; text-decoration: none; color: var(--muted); font-size: .66rem; min-height: 52px; }
  .bottom-bar .gl { font: 600 1.05rem/1.1 var(--f-mono); color: var(--ink-2); }
  .bottom-bar [aria-current="page"] { color: var(--copper); }
  .bottom-bar [aria-current="page"] .gl { color: var(--copper); }
  .view { padding-bottom: 7rem; }
  .return-chip { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 640px) {
  .grid-2 { grid-template-columns: 1fr; }
  .parts { grid-template-columns: 1fr; }
  .paper-grid { grid-template-columns: 1fr; }
  .paper-grid > div:nth-child(odd) { border-right: 0; }
  .pages { grid-template-columns: 1fr; }
  .pager { grid-template-columns: 1fr; }
  .pager a.next { grid-column: 1; }
  .matrix { grid-template-columns: 5.6rem repeat(2, minmax(0, 1fr)); }
  .replay-grid { grid-template-columns: 4.4rem repeat(5, minmax(0, 1fr)); }
  .tile { min-height: 46px; font-size: .62rem; }
  .crumbs .crumb-part { display: none; }
  .depth-toggle button { padding: .38rem .5rem; }
  .nest-level { grid-template-columns: 1fr; gap: .3rem; }
  .q-card { padding: 1rem; }
  .q-card .q-text { font-size: 1.2rem; }
  .rung { grid-template-columns: 2rem 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media print {
  .rail, .topbar, .bottom-bar, .return-chip, .lesson-end .pager, .capture { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
}

/* Refinement notes (imported HTML from the original guide) */
.ref-notes { max-width: 980px; font-family: var(--f-ui); font-size: .92rem; line-height: 1.6; }
.ref-notes section { border-top: 1px solid var(--rule); padding-top: .4rem; margin-top: 1.4rem; }
.ref-notes h2 { font-size: 1.35rem; }
.ref-notes table { margin: .8rem 0; border: 1px solid var(--rule); }
.ref-notes td:first-child { width: 28%; font-weight: 600; }

</style>
</head>

/* ==== src/core.js ==== */
/* The Working Catalyst — core runtime.
   Plain browser JavaScript, no framework, no network. Everything hangs off one
   namespace (WC) so lesson files, widget files and view files can register
   themselves before boot. */
(function () {
  'use strict';
  const WC = (window.WC = window.WC || {});
  WC.lessons = WC.lessons || [];
  WC.widgets = WC.widgets || {};
  WC.quiz = WC.quiz || {};
  WC.views = WC.views || {};

  /* ---------- Small utilities ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const fmt = (x, d = 1) => (Number.isFinite(x) ? (Math.abs(x) < 1e-9 ? 0 : x).toFixed(d) : '—');
  const signed = (x, d = 1) => (Number.isFinite(x) ? (x > 1e-9 ? '+' : x < -1e-9 ? '−' : '') + Math.abs(x).toFixed(d) : '—');
  const stripTags = (h) => String(h).replace(/<style[\s\S]*?<\/style>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/\s+/g, ' ').trim();
  let uidN = 0;
  const uid = (p = 'u') => `${p}-${(++uidN).toString(36)}`;
  /* Deterministic RNG so every simulation shows the same synthetic data on reload. */
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gauss(r) {
    let u = 0, v = 0;
    while (u === 0) u = r();
    while (v === 0) v = r();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function debounce(fn, ms) {
    let t;
    return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
  }
  Object.assign(WC, { esc, $, $$, clamp, fmt, signed, stripTags, uid, rng, gauss, debounce });

  /* ---------- Evidence vocabulary ----------
     Every claim category has a glyph and a word, so meaning never rides on color alone. */
  WC.EV = {
    est: ['◆', 'Established · prior work'],
    prop: ['▲', 'Proposed in this project'],
    hyp: ['H', 'Hypothesis'],
    asm: ['!', 'Assumption'],
    pilot: ['◐', 'Pilot-dependent choice'],
    sim: ['~', 'Teaching simulation'],
    unres: ['?', 'Unresolved question'],
    bgd: ['○', 'Background · outside the proposal'],
    lit: ['◆', 'Prior literature'],
    pexp: ['▲', 'Proposed experiment'],
    meth: ['≡', 'Methodology'],
    feas: ['■', 'Feasibility'],
    bi: ['+', 'Broader impact'],
  };
  const evClass = { lit: 'est', pexp: 'prop', meth: 'meth', feas: 'feas', bi: 'bi' };
  WC.ev = (k, label) => {
    const d = WC.EV[k] || ['•', k];
    return `<span class="ev ev-${evClass[k] || k}"><i aria-hidden="true">${d[0]}</i>${esc(label || d[1])}</span>`;
  };
  /* A short statement tagged with its evidence category. */
  WC.claim = (k, html) => `<div class="claim">${WC.ev(k)}<p>${html}</p></div>`;
  WC.claims = (rows) => `<div class="claims">${rows.map((r) => WC.claim(r[0], r[1])).join('')}</div>`;
