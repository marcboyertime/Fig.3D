  P02S01: { st: 'hyp', ls: ['question', 'falsify', 'evidence'], refs: [],
    asm: ['Two dwell settings produce a measurable precursor contrast.', 'Activation gas changes how much of that contrast survives.', 'Structural and product contrasts can be measured precisely enough to compare across gases.'],
    ch: 'What if both gases erase the contrast equally? Then what?',
    def: 'Then the hypothesis is not supported, which the proposal treats as informative: equivalent contrasts within predeclared bounds argue against co-design in this window. The hypothesis is falsifiable in both structure and products.' },
  P02S02: { st: 'hyp', ls: ['acquisition', 'benchmark', 'aim2'], refs: [6, 7],
    asm: ['Structural assays carry information about θ through a validated relationship.', 'Costs and delays can be declared in advance.', 'The baselines are competitive, not straw men.'],
    ch: 'Adaptive design beating space-filling is well known. Why is this a hypothesis?',
    def: 'Because here the information sources are delayed, destructive and taken on imperfect companions, and a narrow posterior only counts if validation error and calibration hold. Under those conditions an adaptive policy may not win, and the proposal will report that.' },
  P02S03: { st: 'meth', ls: ['aim1', 'aim2', 'falsify'], refs: [],
    asm: ['The two hypotheses have separate evidence and separate failure modes.'],
    ch: 'Aren’t the aims coupled? If Aim 1 fails, Aim 2 has nothing to learn.',
    def: 'They share infrastructure and the θ target, but not their verdicts. A precise null interaction is still a well-defined target to learn cheaply. A great controller does not prove the catalyst mechanism, and a strong catalyst result does not show the controller helped.' },
  P03S01: { st: 'pexp', ls: ['synthesis'], refs: [1],
    asm: ['Spray coating gives reproducible loading on carbon paper.', 'Joule heating of coated carbon paper can be calibrated to a temperature history.'],
    ch: 'How do you know the temperature? Joule heating of carbon paper is notoriously nonuniform.',
    def: 'That is why the proposal records calibrated temperature traces rather than trusting electrical power. Uniformity and reproducibility are Year 1 feasibility checks. The recorded trace, not the setpoint, is what enters the model.' },
  P03S02: { st: 'pexp', ls: ['twobytwo', 'synthesis'], refs: [],
    asm: ['Two dwell times create a structural contrast at fixed peak temperature and cooling.', 'CO and N₂ activation are otherwise matched.'],
    ch: 'Song varied ramp rate, not dwell. Why do you expect dwell to produce a contrast?',
    def: 'It is not assumed. Dwell is an automatable knob that plausibly changes coarsening and phase; whether it produces a reproducible contrast is the first pilot gate. If it does not, the thermal variable must change before the interaction can be tested.' },
  P03S03: { st: 'meth', ls: ['activation', 'twobytwo'], refs: [],
    asm: ['Sharing flow and the current–time program is the right way to match activation.', 'The common CO test is identical across electrodes.'],
    ch: 'Under the same current, a CO-fed cathode and an N₂-fed cathode sit at different potentials. Isn’t that a confound?',
    def: 'It is part of what “activation gas” means in this design, so the proposal does not claim equal potential. That is why it adds structural endpoint checks instead of assuming equal conversion, and reports voltage. If potentials differ strongly, that is recorded as part of the treatment.' },
  P03S04: { st: 'meth', ls: ['activation'], refs: [],
    asm: ['Structural methods (e.g., diffraction) can detect residual oxide at the relevant level.'],
    ch: 'How will you know reduction is complete?',
    def: 'Not from charge alone: charge splits among oxide reduction, hydrogen evolution and, under CO, CO reduction. Endpoint diffraction and microscopy check the oxide fraction. If endpoints differ, that difference becomes a measured variable rather than a hidden one.' },
  P03S05: { st: 'meth', ls: ['replication', 'twobytwo'], refs: [],
    asm: ['Day and channel effects exist and can be balanced across conditions.'],
    ch: 'What is your replicate?',
    def: 'An independent coating and heating run. Images, injections and time windows from one electrode are nested measurements, not replicates. Conditions are distributed across days and channels so neither aligns with a treatment.' },
  P03S06: { st: 'meth', ls: ['replication', 'evidence'], refs: [],
    asm: ['Pilot variance estimates are good enough to plan the confirmatory study.', 'A scientifically meaningful interaction size can be set in advance.'],
    ch: 'How many replicates do you need? You don’t say.',
    def: 'That is deliberate: the number depends on preparation-level variance that does not exist yet. The pilot estimates it, the meaningful interaction is declared before confirmatory data, and replication is sized from both.' },
  P04S01: { st: 'meth', ls: ['structure', 'journey'], refs: [],
    asm: ['These three time points capture the relevant transformations.', 'Recovered samples represent the stage they were taken from.'],
    ch: 'Why three time points? Isn’t one postmortem enough?',
    def: 'One postmortem cannot tell inheritance from convergence during operation. Before, at the activation endpoint, and after operation together locate where a contrast survives or disappears.' },
  P04S02: { st: 'meth', ls: ['structure'], refs: [],
    asm: ['Selected TEM fields represent the electrode well enough to compare treatments.', 'Blinding is maintained through analysis.'],
    ch: 'TEM sees a few hundred nanometers. How is that representative of a whole electrode?',
    def: 'It is not a census, which is why it is selected, blinded and paired with bulk diffraction. Diffraction gives averaged coherent-domain and phase information; TEM gives local grain and subgrain evidence. Neither alone identifies boundary density.' },
  P04S03: { st: 'meth', ls: ['journey', 'prior'], refs: [4],
    asm: ['The deliberate-exposure control produces measurable changes if handling matters.'],
    ch: 'Even air-free transfer happens after the bias is off. How is that the working structure?',
    def: 'It is not, and the proposal does not claim it is. Yang et al. showed metallic copper nanograins under bias that oxidized to Cu₂O nanocubes on air exposure. The control tests handling artifacts; it does not turn a recovered sample into an operando one. Operando beamtime is optional for that reason.' },
  P04S04: { st: 'meth', ls: ['journey', 'acquisition'], refs: [],
    asm: ['Companions prepared together are similar enough to be informative.', 'Mismatch can be measured, for instance by assaying pairs of companions.'],
    ch: 'Your companion is not the electrode you tested. Why should I believe its TEM?',
    def: 'You should believe it only as much as measured companion consistency allows. The proposal estimates mismatch experimentally and carries it into the model, so a companion assay informs the tested electrode with appropriately wide uncertainty.' },
  P04S05: { st: 'meth', ls: ['alternatives'], refs: [5],
    asm: ['These checks cover the most plausible non-structural explanations.'],
    ch: 'How do you know the difference isn’t wetting or contamination rather than structure?',
    def: 'Each has a check: heated-support controls for substrate changes, loading measurements, ICP-OES for contaminants (Xu et al. found anode-derived Ir contamination degrading MEA CO electrolysis), and wetting and CO-access tests. They constrain, not eliminate, alternatives.' },
  P04S06: { st: 'meth', ls: ['alternatives', 'evidence'], refs: [1],
    asm: ['A second thermal route can reach matched oxide fractions with different architecture.'],
    ch: 'Matched oxide fraction doesn’t mean matched everything else.',
    def: 'Correct, and the proposal only claims it “challenges” the interpretation. If a different route with matched oxide fraction gives a consistent structure–response relationship, the architectural reading gains support; if not, it loses support.' },
  P04S07: { st: 'meth', ls: ['alternatives'], refs: [],
    asm: ['Mediators and nuisance variables can be told apart by their causes.'],
    ch: 'Isn’t a transport effect just an artifact?',
    def: 'Only if it comes from something unrelated to the architecture, like assembly variation. If architecture changes porosity and therefore CO access, transport is how the structural effect works. Adjusting it away would erase a real effect.' },
  P05S01: { st: 'meth', ls: ['products', 'theta'], refs: [],
    asm: ['Late-window output is a stable enough response to compare.', 'Fixed total current is the right operating comparison.'],
    ch: 'Why partial current and not Faradaic efficiency?',
    def: 'At fixed total current they carry the same information, but partial current density is the absolute rate of making n-propanol per area, which is what matters if production is the point. Ratios can rise while production falls.' },
  P05S02: { st: 'meth', ls: ['products'], refs: [1, 8],
    asm: ['Volatile and crossover losses can be measured and corrected or bounded.'],
    ch: 'n-Propanol is volatile and crosses membranes. How do you know you caught it all?',
    def: 'The chain checks recovery, collection delay, outlet flow and crossover explicitly, with GC for gases and quantitative NMR for liquids, following reporting standards. Charge balance flags missing product.' },
  P05S03: { st: 'meth', ls: ['products', 'activation'], refs: [],
    asm: ['Activation-period products can be physically separated from the test.'],
    ch: 'Why bother separating activation products?',
    def: 'Under CO activation the electrode already makes products during activation; under N₂ it cannot. Pooling them would make the CO arm look better for a trivial reason.' },
  P05S04: { st: 'meth', ls: ['products'], refs: [],
    asm: ['Ratios and absolute rates can disagree, so both are needed.'],
    ch: 'Isn’t C₃/C₂ the natural selectivity metric?',
    def: 'It is a useful diagnostic of branching, but it can rise because C₂ falls while propanol also falls. Absolute production, charge balance and voltage stay reported so no single ratio carries the claim.' },
  P05S05: { st: 'meth', ls: ['products', 'feasibility'], refs: [1],
    asm: ['50 hours is long enough to detect meaningful drift in this system.'],
    ch: 'Song ran 330 hours. Why only 50?',
    def: 'The goal is persistence of the interaction beyond a two-hour screen, on selected conditions, not a durability record. 50 hours bounds the claim; anything longer would compete with the campaign for channel time.' },
  P05S06: { st: 'pexp', ls: ['evidence', 'twobytwo'], refs: [],
    asm: ['A structure–performance relationship learned on some preparations will predict new ones.'],
    ch: 'What exactly is the decisive test?',
    def: 'Two steps: a replicated difference of differences (does the precursor contrast change with activation?), then a prediction for a new preparation not used to fit the relationship. The second prevents explaining the data with the data.' },
  P05S07: { st: 'meth', ls: ['evidence', 'novelty'], refs: [],
    asm: [],
    ch: 'So what is the mechanism?',
    def: 'The proposal deliberately stops short: an interaction supports co-design and, with structural evidence, an architectural interpretation. A specific active site would need site-sensitive evidence such as operando spectroscopy or isotope studies, which are optional extensions.' },
  P06S01: { st: 'meth', ls: ['falsify', 'evidence'], refs: [],
    asm: ['Structural and product interactions can be measured on the same preparations or valid companions.'],
    ch: 'What counts as support?',
    def: 'Gas-dependent retention in structure plus a replicated product interaction outside the meaningful bound, both in the same direction of interpretation.' },
  P06S02: { st: 'meth', ls: ['falsify', 'evidence'], refs: [],
    asm: ['Meaningful bounds can be justified before confirmatory data.'],
    ch: 'Can’t you always say “not significant, more work needed”?',
    def: 'No. The proposal predeclares a meaningful bound. If the interval for the interaction sits inside it, the result is “equivalent,” an informative negative. If the interval straddles the bound, the result is “unresolved,” and it is reported as such.' },
  P06S03: { st: 'meth', ls: ['falsify', 'evidence'], refs: [],
    asm: [],
    ch: 'If structure is retained but products converge, didn’t you waste your time?',
    def: 'No. That bounds the relevance of that structure to this output under these conditions, which is a real finding about what processing history does and does not control.' },
  P07S01: { st: 'pexp', ls: ['aim2', 'feasibility'], refs: [],
    asm: ['The pilot validates the assays and defines a safe operating window.'],
    ch: 'Why not start autonomous from day one?',
    def: 'Because an SDL that optimizes a broken assay learns the assay’s errors. Assay validation comes first; expansion stays inside the tested window.' },
  P07S02: { st: 'meth', ls: ['theta'], refs: [],
    asm: ['Late-window output at a given dwell and gas has a well-defined expectation.', 'The reference dwell is fixed before confirmatory evaluation.'],
    ch: 'Why subtract a reference?',
    def: 'The CO-versus-N₂ effect g(t) mixes a constant gas benefit with any dwell-dependence. Subtracting g(t_ref) removes the constant part, so θ(t) is zero everywhere if the gas helps equally at all dwells. Only preparation-dependent activation effects remain.' },
  P07S03: { st: 'meth', ls: ['theta', 'benchmark'], refs: [],
    asm: [],
    ch: 'Why not optimize n-propanol yield like everyone else?',
    def: 'Because the scientific question is the interaction. Using the same θ for decisions and scoring prevents a policy from claiming success on a different quantity than it was steering toward.' },
  P07S04: { st: 'lit', ls: ['novelty', 'acquisition'], refs: [6, 7],
    asm: ['Delay, destructiveness and imperfect companions change the decision problem enough to be a contribution.'],
    ch: 'SARA already chooses synthesis and characterization; Binois already handles replicate versus explore. What is new?',
    def: 'Neither handles delayed, destructive assays whose information reaches the target only through imperfect companions. SARA’s optical characterization is fast and non-destructive; Binois studies stochastic simulators. The contribution is bounded and testable, not a claim to invent active learning.' },
  P07S05: { st: 'meth', ls: ['model'], refs: [],
    asm: ['The levels of variation are identifiable with the planned replication.'],
    ch: 'What model, exactly?',
    def: 'The two pages commit to the structure (processing, structure and performance linked, with preparation, reactor and measurement variation), not to one kernel. Direct processing-to-performance paths are kept so the model does not force every effect through a measured descriptor.' },
  P07S06: { st: 'meth', ls: ['model', 'acquisition'], refs: [],
    asm: ['The timing of when information is available is recorded.'],
    ch: 'If structure predicts performance, doesn’t that prove structure causes it?',
    def: 'No. Prediction uses association. Mediation would need structure to be manipulated or the causal pathway otherwise identified. Pretest companion data can sharpen predictions; post-test data help interpret, and mixing the two is leakage.' },
  P08S01: { st: 'meth', ls: ['acquisition', 'actions'], refs: [7],
    asm: ['Expected variance reduction can be computed or approximated for each action type.', 'The dwell grid and weights reflect the scientific domain.'],
    ch: 'Why integrated variance and not expected improvement?',
    def: 'Because the goal is to learn a curve precisely, not to find a maximum. Integrated posterior variance measures uncertainty about θ across the declared domain; dividing by cost lets make, measure and repeat compete on one scale.' },
  P08S02: { st: 'meth', ls: ['acquisition', 'loops'], refs: [],
    asm: ['Cost components can be measured and weighted defensibly.'],
    ch: 'Isn’t TEM always worth it? It’s the best structural data.',
    def: 'Not automatically. Its value depends on how strongly it informs θ through the validated link and companion consistency, divided by its full cost including delay. If that ratio is low, the controller should learn not to buy it.' },
  P08S03: { st: 'pexp', ls: ['hardware', 'loops'], refs: [],
    asm: ['Robotic coating, heating, cassette handling, gas switching and testing can be integrated with one scheduler.'],
    ch: 'What does the robot physically do?',
    def: 'Coat, heat, move electrodes in cassettes, switch activation gas and run tests. The scheduler turns a chosen action into those jobs and folds in delayed results (liquid NMR, TEM) when they arrive.' },
  P08S04: { st: 'feas', ls: ['actions', 'feasibility'], refs: [],
    asm: [],
    ch: 'Could the optimizer skip a calibration to save cost?',
    def: 'No. Calibrations and safety checks are outside the optimizer’s action space; they are scheduled unconditionally and their cost is charged to every policy.' },
  P08S05: { st: 'meth', ls: ['actions', 'feasibility'], refs: [],
    asm: ['Faults and material failures can be told apart reliably.'],
    ch: 'How do you treat a failed run?',
    def: 'By cause. A leaking line invalidates the measurement. Repeatable delamination at one preparation setting is a feasibility outcome the model keeps; deleting it would reward fragile recipes.' },
  P09S01: { st: 'pexp', ls: ['replay'], refs: [],
    asm: ['A fixed grid of reasonable size is affordable in Year 2.'],
    ch: 'Why build a separate archive? Just replay your adaptive campaign.',
    def: 'An archive built by the adaptive policy only contains what it chose, which flatters it. A policy-independent replicated grid lets every policy face the same finite evidence.' },
  P09S02: { st: 'meth', ls: ['replay'], refs: [],
    asm: ['Replay respects which measurements exist and when they would arrive.'],
    ch: 'Isn’t replay just cheating with a known answer?',
    def: 'Only if it reveals measurements the policy did not pay for. Here a policy sees a measurement only after selecting and paying for it, and validation preparations stay hidden.' },
  P09S03: { st: 'meth', ls: ['benchmark'], refs: [],
    asm: ['The adaptive baseline is a fair, competent alternative.'],
    ch: 'Isn’t beating space-filling easy?',
    def: 'Which is why there is also an adaptive search with fixed characterization and replication. Beating it isolates the value of choosing what to measure and when to repeat.' },
  P09S04: { st: 'meth', ls: ['benchmark', 'model'], refs: [],
    asm: ['Validation preparations are numerous enough to assess error and calibration.'],
    ch: 'What if your controller is confidently wrong?',
    def: 'Then it fails. The score is cost to reach the variance threshold, but only if validation error and calibration limits on the same θ curve are met.' },
  P09S05: { st: 'pexp', ls: ['replay', 'benchmark'], refs: [],
    asm: ['Enough prospective campaigns can run to say something about physical performance.'],
    ch: 'Replay is cheap. Why run prospective campaigns?',
    def: 'Replay cannot create new preparations, reproduce real delays and faults, or test conditions the archive never recorded. Interleaving campaigns across days prevents one policy getting a better week.' },
  P09S06: { st: 'meth', ls: ['benchmark', 'replication'], refs: [],
    asm: ['Preparation groups are kept intact across splits.'],
    ch: 'What’s the difference between your two holdouts?',
    def: 'A preparation holdout is a fresh batch of a known recipe and tests reproducibility. A condition holdout is an unseen recipe and tests transfer. Mixing them blurs two different claims.' },
  P09S07: { st: 'meth', ls: ['benchmark', 'acquisition'], refs: [],
    asm: ['The ablation uses the same splits, costs and evaluation.'],
    ch: 'How do you know the structural data helped at all?',
    def: 'Remove it and compare under identical conditions. If performance is unchanged, the expensive characterization did not earn its place, and that is reported.' },
  P10S01: { st: 'feas', ls: ['feasibility'], refs: [],
    asm: ['These experiences transfer to the proposed tasks.'],
    ch: 'Have you done Joule heating or MEA testing yourself?',
    def: 'Answer truthfully from your own record. The sentence links nanomaterials synthesis, robotic coating, electrochemistry and ICP-OES to the workflow; do not claim specific techniques you have not run.' },
  P10S02: { st: 'feas', ls: ['feasibility'], refs: [],
    asm: ['Each year’s gate can be passed in roughly a year.'],
    ch: 'Isn’t three years tight for building an SDL and doing the science?',
    def: 'Yes, which is why Year 1 is about validating the assays and the precursor contrast, and one station is extended before any parallelization. Each year ends with a usable result even if the next is delayed.' },
  P10S03: { st: 'feas', ls: ['feasibility', 'hardware'], refs: [],
    asm: ['A suitable host exists and will grant access.'],
    ch: 'Do you have a lab lined up?',
    def: 'The proposal says “seek,” so be honest about status. Name the kinds of groups with gas-fed testing and shared microscopy and NMR that fit, without implying commitments that do not exist.' },
  P10S04: { st: 'feas', ls: ['feasibility', 'hardware'], refs: [],
    asm: ['Institutional safety review is available and achievable.'],
    ch: 'CO is toxic. How will you run it unattended?',
    def: 'Only after professionally reviewed interlocks and commissioning: gas detection, ventilation and automatic shutoffs approved by the institution. Autonomy never authorizes operation outside approved constraints.' },
  P10S05: { st: 'feas', ls: ['feasibility', 'evidence'], refs: [],
    asm: ['Core claims can be supported without operando data.'],
    ch: 'Without operando data, how can you talk about the working catalyst?',
    def: 'Carefully. Without operando data the claims stop at processing interactions and structural interpretations of recovered, handling-checked states. Beamtime would strengthen specific interpretations; the core design does not depend on it.' },
  P11S01: { st: 'bi', ls: ['impact'], refs: [],
    asm: ['Methods and infrastructure transfer to other groups.'],
    ch: 'How does this help society?',
    def: 'By making autonomous experimentation with slow, destructive assays more trustworthy and reusable, and by contributing to electrified chemical synthesis knowledge, without claiming deployment.' },
  P11S02: { st: 'bi', ls: ['impact', 'replay'], refs: [],
    asm: ['Host agreements permit release.'],
    ch: 'Will you really release data with failures?',
    def: 'That is the commitment, subject to host agreements. Failures and sample histories are what make an archive useful for benchmarking and teaching.' },
  P11S03: { st: 'bi', ls: ['impact'], refs: [],
    asm: ['A laptop replay preserves the reasoning without hardware.'],
    ch: 'What will students actually do?',
    def: 'Run the replay with a budget, choosing make, measure or repeat, and see how their choices affect what they learn and what it cost.' },
  P11S04: { st: 'bi', ls: ['impact', 'actions'], refs: [],
    asm: [],
    ch: 'Isn’t that just a game?',
    def: 'It is a structured decision exercise mirroring Aim 2. Its value is assessed with a rubric, not assumed.' },
  P11S05: { st: 'bi', ls: ['impact'], refs: [],
    asm: ['A course partner can be found.'],
    ch: 'How will you know it worked?',
    def: 'A pre/post rubric on confounders, uncertainty and decision quality with about twenty students. It is a pilot, not a powered educational study.' },
  P11S06: { st: 'bi', ls: ['impact'], refs: [],
    asm: ['Mentoring time is available alongside the research.'],
    ch: 'Is the mentee real?',
    def: 'It is a plan, not a named student. Describe how you would recruit and what they would own.' },
};

    ['Particle', 'A physically separate piece of solid, as seen in SEM or TEM. One particle can contain many grains, and its size is not the crystallite or grain size.', ['particles']],
    ['Aggregate', 'Particles stuck together by necks or sintering; an agglomerate is held more loosely. Aggregates set porosity and electronic pathways in a coated electrode.', ['agglomerate', 'aggregates']],
    ['Crystallite', 'Often used to mean the X-ray coherent-scattering domain: the region that diffracts in phase. Its size from peak broadening (e.g., Scherrer analysis) is usually smaller than or equal to the grain size, because subgrains, twins, faults and strain also break coherence.', ['crystallite size', 'coherent-domain dimensions']],
    ['Grain', 'A region of one crystal orientation bounded by grain boundaries. A grain may contain subgrains or twins, so grain size, crystallite size and particle size are three different numbers.', ['grains', 'grain size']],
    ['Intragrain domain', 'A smaller region inside a grain separated by low-angle boundaries, twins or other defects. Song et al. describe ≈10 nm intragrain features inside ≈35 nm grains. The proposal calls these grain/subgrain structures.', ['intragrain feature', 'subgrain', 'intragrain domains']],
    ['Porosity', 'Empty space within and between particles and aggregates. It controls where liquid and gas can go, so it links architecture to wetting, flooding and CO access.', []],
    ['Interparticle contact', 'A neck or junction where particles touch. Contacts carry electrons and hold the layer together; they can sinter during heating or open during reduction.', ['connectivity', 'particle connectivity', 'neck']],
    ['Surface roughness', 'How much real surface exists per geometric area. Often estimated electrochemically from double-layer capacitance (an ECSA proxy). Rougher is not automatically more selective.', ['roughness', 'roughness factor']],

    ['Scherrer analysis', 'Estimating coherent-domain size from diffraction peak width. Instrumental broadening and microstrain also widen peaks, so the number is an estimate of coherent-domain size, never a grain-boundary density.', ['scherrer']],

    ['Operando', 'Measured while the catalyst works under realistic reaction conditions, with products measured at the same time. In situ means in the reaction environment; ex situ means removed from it.', ['in situ', 'ex situ']],
    ['Postmortem', 'Characterization after the experiment, after bias is removed and the sample is recovered. It can differ from the working state, for example by re-oxidation in air.', ['postmortem characterization', 'post-mortem']],
    ['Galvanostatic', 'Controlling current and letting potential float. Equal current across electrodes does not mean equal cathode potential.', ['current control']],
    ['Cathode potential', 'The electrode potential at the copper side, measured against a reference electrode. MEA cell voltage includes the anode, membrane and resistive losses, so it is not the cathode potential.', ['equal potential']],

    ['Local pH', 'The pH right at the catalyst surface, which can differ greatly from the bulk electrolyte because reduction produces hydroxide. Architecture and current both change it.', []],
    ['Adparticle', 'A small cluster of atoms sitting on a larger surface. Li et al. found Cu adparticles after reducing an oxide under CO, not under N₂.', ['adparticles']],
    ['Nanobumps', 'In Li et al., ≈7.5 nm undulations that formed when the grain-boundary-rich, N₂-reduced surface restructured during CO reduction.', ['nanobump']],
    ['Charge balance', 'Checking that the Faradaic efficiencies of all measured products sum to about 100%. A shortfall means missed products, losses, or unaccounted processes.', ['faradaic balance']],

    ['Pseudoreplication', 'Treating repeated measurements of the same independent unit as if they were independent units. Ten images of one electrode are not ten preparations.', ['pseudoreplicate']],

    ['Acquisition function', 'The score a controller uses to rank possible next actions. Here: expected reduction in integrated posterior variance of θ per unit cost.', ['acquisition']],
    ['Gaussian process', 'A flexible probabilistic model for an unknown function that gives a mean prediction and an uncertainty band. A common choice for this kind of controller; the proposal does not commit to one model family.', ['gp']],

    ['IMSPE', 'Integrated mean-squared prediction error: prediction variance averaged over the input domain. The proposal’s integrated variance of θ is the same idea applied to the interaction curve.', ['integrated mean squared prediction error']],
    ['Latency', 'Delay between starting an action and receiving its result. Online GC returns in minutes; liquid NMR in hours to days; facility TEM in days or weeks.', ['delay']],

})();

/* Shared SVG helpers for widgets. Charts read colors from CSS custom properties,
   so they follow the theme; widgets call WC.onRedraw to repaint on theme change. */
(function () {
  'use strict';
  const WC = window.WC;
  const S = (WC.svg = {});
  S.css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
  S.lin = (d0, d1, r0, r1) => { const k = (r1 - r0) / ((d1 - d0) || 1); const f = (x) => r0 + (x - d0) * k; f.inv = (y) => d0 + (y - r0) / k; return f; };
  S.ticks = (a, b, n = 5) => {
    const span = b - a || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = []; for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(10));
    return out;
  };
  S.path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  S.area = (top, bot) => S.path(top) + bot.slice().reverse().map((p) => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('') + 'Z';
  /* frame({w,h,m,x:[a,b],y:[a,b],xl,yl,xt,yt,xfmt,yfmt,zero}) → {x,y,svgOpen,axes} */
  S.frame = function (o) {
    const m = Object.assign({ t: 14, r: 14, b: 38, l: 48 }, o.m || {});
    const x = S.lin(o.x[0], o.x[1], m.l, o.w - m.r), y = S.lin(o.y[0], o.y[1], o.h - m.b, m.t);
    const xt = o.xt || S.ticks(o.x[0], o.x[1], 5), yt = o.yt || S.ticks(o.y[0], o.y[1], 4);
    const xf = o.xfmt || ((v) => v), yf = o.yfmt || ((v) => v);
    let g = '';
    yt.forEach((v) => { g += `<line class="gridline" x1="${m.l}" x2="${o.w - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="svg-text" x="${m.l - 6}" y="${y(v) + 3.5}" text-anchor="end">${xfEsc(yf(v))}</text>`; });
    xt.forEach((v) => { g += `<line class="axis" x1="${x(v)}" x2="${x(v)}" y1="${o.h - m.b}" y2="${o.h - m.b + 4}"/><text class="svg-text" x="${x(v)}" y="${o.h - m.b + 16}" text-anchor="middle">${xfEsc(xf(v))}</text>`; });
    g += `<line class="axis" x1="${m.l}" x2="${o.w - m.r}" y1="${o.h - m.b}" y2="${o.h - m.b}"/>`;
    if (o.zero && o.y[0] < 0 && o.y[1] > 0) g += `<line x1="${m.l}" x2="${o.w - m.r}" y1="${y(0)}" y2="${y(0)}" stroke="${S.css('--ink-2')}" stroke-width="1.2"/>`;
    if (o.xl) g += `<text class="svg-label" x="${(m.l + o.w - m.r) / 2}" y="${o.h - 4}" text-anchor="middle">${o.xl}</text>`;
    if (o.yl) g += `<text class="svg-label" transform="translate(12 ${(m.t + o.h - m.b) / 2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
    return { x, y, m, axes: g };
  };
  function xfEsc(s) { return WC.esc(String(s)); }
  S.svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${WC.esc(label || '')}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
  /* Little helper to wire a slider with an <output>. */
  S.slider = (id, label, min, max, step, val, unit = '') => `<label class="ctl" for="${id}"><span class="ctl-row"><span>${label}</span><output id="${id}-o" for="${id}">${val}${unit}</output></span><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
  /* Voronoi cells inside a convex polygon by half-plane clipping. Deterministic. */
  S.clip = function (poly, a, b, c) { // keep a*x+b*y <= c
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const fp = a * p[0] + b * p[1] - c, fq = a * q[0] + b * q[1] - c;
      if (fp <= 0) out.push(p);
      if ((fp < 0 && fq > 0) || (fp > 0 && fq < 0)) { const t = fp / (fp - fq); out.push([p[0] + t * (q[0] - p[0]), p[1] + t * (q[1] - p[1])]); }
    }
    return out;
  };
  S.voronoi = function (seeds, boundary) {
    return seeds.map((s, i) => {
      let cell = boundary.slice();
      seeds.forEach((t, j) => {
        if (i === j || cell.length < 3) return;
        const a = t[0] - s[0], b = t[1] - s[1];
        const c = (t[0] * t[0] + t[1] * t[1] - s[0] * s[0] - s[1] * s[1]) / 2;
        cell = S.clip(cell, a, b, c);
      });
      return cell;
    });
  };
  S.circlePoly = (cx, cy, r, n = 28, wob = 0, rand) => Array.from({ length: n }, (_, k) => { const t = (2 * Math.PI * k) / n; const rr = r * (1 + (wob && rand ? (rand() - .5) * wob : 0)); return [cx + rr * Math.cos(t), cy + rr * Math.sin(t)]; });
  S.polyPath = (p) => p.length ? 'M' + p.map((q) => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join('L') + 'Z' : '';
  S.centroid = (p) => { let x = 0, y = 0; p.forEach((q) => { x += q[0]; y += q[1]; }); return [x / p.length, y / p.length]; };
  S.shrink = (p, k) => { const c = S.centroid(p); return p.map((q) => [c[0] + (q[0] - c[0]) * k, c[1] + (q[1] - c[1]) * k]); };
})();

  WC.widgets.companion = function (el) {
    const p = pfx();
    el.innerHTML = `<div class="panel"><div class="panel-head"><h2 class="p-title">How much does a companion tell you?</h2>${WC.ev('sim')}</div>${WC.simBanner('Synthetic specimens · a linear-Gaussian toy, not the proposal’s model')}
<div class="panel-body"><div class="controls">${S.slider(p + 'm', 'Preparation variability between siblings (companion mismatch)', 0, 2, 0.05, 0.4)}${S.slider(p + 'a', 'Assay error (TEM descriptor)', 0.05, 1, 0.05, 0.2)}</div>
<div class="grid-2"><div><div class="chart" data-pair></div></div><div><div class="chart" data-c></div></div></div>
<div class="grid-3" data-m style="margin-top:.6rem"></div><div class="readout" data-r aria-live="polite"></div></div>
<div class="panel-foot">Each tested electrode has a true structural descriptor s. Its companion has s + δ (mismatch, SD set by the first slider) and is measured with assay error. Conditions A and B differ in mean s by 2 units; within-condition spread of s is 0.6. Values are dimensionless.</div></div>`;
    const pair = $('[data-pair]', el), c = $('[data-c]', el), mEl = $('[data-m]', el), r = $('[data-r]', el);
    const R = rng(42);
    const base = Array.from({ length: 40 }, (_, k) => ({ cond: k % 2, u: gauss(R) * 0.6, dz: gauss(R), ez: gauss(R) }));
    function draw() {
      const sm = val(el, p + 'm'), sa = val(el, p + 'a');
      out(el, p + 'm', sm.toFixed(2)); out(el, p + 'a', sa.toFixed(2));
      const pts = base.map((b) => { const s = (b.cond ? 1 : -1) + b.u; return { s, z: s + b.dz * sm + b.ez * sa, cond: b.cond }; });
      const W = 340, H = 260;
      const f = S.frame({ w: W, h: H, x: [-4, 4], y: [-3, 3], xt: [-4, -2, 0, 2, 4], yt: [-2, 0, 2], xl: 'companion assay result', yl: 'tested electrode’s true s', m: { l: 46, b: 40 } });
      let g = f.axes + `<path d="M${f.x(-3)},${f.y(-3)} L${f.x(3)},${f.y(3)}" style="stroke:var(--rule-strong);stroke-dasharray:4 3"/>`;
      pts.forEach((q) => { const x = f.x(clamp(q.z, -4, 4)), y = f.y(q.s); g += q.cond ? `<circle cx="${x}" cy="${y}" r="4" style="fill:var(--c-co);opacity:.85"/>` : `<rect x="${x - 3.5}" y="${y - 3.5}" width="7" height="7" style="fill:var(--c-n2);opacity:.85"/>`; });
      c.innerHTML = S.svg(W, H, g, 'Scatter of companion assay results against the true descriptor of the tested electrode.') + `<div class="legend"><span>■ <span class="muted">condition A</span></span><span>● <span class="muted">condition B</span></span><span class="muted">dashed: perfect agreement</span></div>`;
      // Two-electrode picture with mismatch
      const prt = (cx, seedShift, label, col) => {
        const rr = rng(77);
        const seeds = Array.from({ length: 9 }, () => [cx + (rr() - 0.5) * 100, 120 + (rr() - 0.5) * 100]);
        const rr2 = rng(200 + seedShift);
        const sd = seeds.map((q) => [q[0] + (rr2() - 0.5) * 60 * sm, q[1] + (rr2() - 0.5) * 60 * sm]);
        const bnd = S.circlePoly(cx, 120, 58, 32, 0.08, rng(3));
        return S.voronoi(sd, bnd).map((cc) => `<path d="${S.polyPath(cc)}" style="fill:var(--copper-soft);stroke:var(--copper);stroke-width:1"/>`).join('') + `<path d="${S.polyPath(bnd)}" style="fill:none;stroke:${col};stroke-width:2"/><text class="svg-label" x="${cx}" y="200" text-anchor="middle">${label}</text>`;
      };
      pair.innerHTML = S.svg(340, 260, `<text class="svg-title" x="170" y="22" text-anchor="middle">Same run, same recipe</text>${prt(85, 0, 'performance electrode', 'var(--copper)')}${prt(255, 1, 'companion', 'var(--st-hyp)')}<text class="svg-text" x="85" y="222" text-anchor="middle">→ MEA test (products)</text><text class="svg-text" x="255" y="222" text-anchor="middle">→ TEM (destroyed)</text>`, 'Performance electrode and companion drawn with grain patterns that diverge as mismatch grows.');
      const vs = 1 + 0.36, vw = 0.36; // total var of s, within-condition var
      const R2 = vs / (vs + sm * sm + sa * sa);
      const postSD = Math.sqrt(vs * (1 - R2));
      const dprime = 2 / Math.sqrt(vw + sm * sm + sa * sa);
      mEl.innerHTML = `<div class="stat ${R2 > 0.7 ? 'ok' : R2 < 0.4 ? 'hi' : ''}"><small>Variance of s explained</small><b>${fmt(100 * R2, 0)}%</b><span>by one companion assay</span></div><div class="stat"><small>Remaining SD of s</small><b>${fmt(postSD, 2)}</b><span>prior SD ${fmt(Math.sqrt(vs), 2)}</span></div><div class="stat"><small>Separation of A vs B</small><b>${fmt(dprime, 1)}</b><span>d′ from companions</span></div>`;
      r.className = 'readout' + (R2 < 0.4 ? ' warn' : '');
      r.innerHTML = sm < 0.15 ? 'With nearly identical siblings, the companion’s precise TEM almost pins down the tested electrode. The assay error, not mismatch, limits you.' : R2 > 0.6 ? `Mismatch is noticeable but the companion still carries most of the information (${fmt(100 * R2, 0)}%). The model should widen uncertainty accordingly, not ignore it.` : `Mismatch now dominates. A very precise TEM of the companion says little about the tested electrode (${fmt(100 * R2, 0)}% of variance), so its value to the controller collapses, however sophisticated the instrument. Notice that improving assay error barely helps.`;
    }

      const rate = (t) => (t > 120 ? 0 : 10 + ev * (1 - Math.exp(-t / 25)));
      const tr = [], ar = [];

  WC.widgets.sandbox = function (el) {

<h2><span class="h-num">1.1</span>Why copper oxide cannot stay oxide</h2>
<p>CO electroreduction on copper runs at strongly negative (reducing) potentials. Copper oxides are thermodynamically unstable there: electrons and protons (or water) remove their oxygen, leaving metallic copper. That is why an oxide precursor must be <em>activated</em> before it can be compared as a copper catalyst.</p>
${call('bgd', `<p>Standard tabulated potentials put the Cu₂O/Cu couple near +0.47 V and the CuO/Cu₂O couple near +0.67 V on the reversible hydrogen electrode scale. CO reduction to multicarbon products typically runs well below 0 V on that scale, so the driving force to reduce the oxide is large. Kinetics, local pH and transport decide how fast and how completely it happens. Whether traces of oxidized copper persist during operation, and whether they matter, is debated in the wider literature. The proposal does not depend on that debate: it measures oxide fractions rather than assuming them.</p>`)}
${rig(`<p>For the couple Cu₂O + 2H⁺ + 2e⁻ → 2Cu + H₂O, the Nernst equation gives E = E° − (RT/2F) ln(1/a<sub>H⁺</sub>²), which on the RHE scale removes the pH term. At an applied potential E<sub>app</sub> &lt; E°, the reduction is favorable by ΔG = −2F(E° − E<sub>app</sub>) per Cu₂O. With E° ≈ 0.47 V<sub>RHE</sub> and E<sub>app</sub> ≈ −0.6 V<sub>RHE</sub>, that is roughly −200 kJ mol⁻¹. This is a thermodynamic statement only; it says nothing about which microstructure forms, which is a kinetic question.</p>`, 'thermodynamics')}

<h2><span class="h-num">1.2</span>Why surfaces restructure, not only reduce</h2>
<p>Three effects make copper rearrange during and after reduction:</p>
<ul>
<li><strong>Oxygen leaves, volume collapses.</strong> A copper atom takes up roughly 40–45% less volume in the metal than in its oxides (lesson 2 shows the arithmetic). The solid must open pores, crack or shrink.</li>
<li><strong>Atoms are mobile.</strong> Copper surface atoms move readily at room temperature, especially where they have few neighbors (edges, boundaries, small particles).</li>
<li><strong>Adsorbates change what is stable.</strong> CO binds strongly to copper. Li et al. report that strong CO interaction with under-coordinated copper can make N₂-reduced surfaces restructure once CO operation starts, eliminating surface grain boundaries ${ref(2)}.</li>
</ul>
${reviewer('If copper restructures this easily, how can any precursor feature be inherited?', 'Restructuring is local and kinetic, not total. Song et al. observed nanoscale grain features retained after 330 h of operation. Whether a feature survives depends on its size, the boundaries that pin it, and the conditions; whether the activation gas changes that is exactly what the proposal tests.')}
${call('mis', `<p><strong>“The XRD of the as-made electrode tells me the catalyst’s structure.”</strong> It tells you the precatalyst’s phases and coherent-domain sizes. The working catalyst is a different object. That is why the proposal measures before activation, at its endpoint and after operation ${src('P04')}.</p>`)}

<h2><span class="h-num">1.3</span>What is established and what is proposed</h2>
${claims([

${check('q-transform-why')}

<p>The route in the proposal is: spray copper nitrate on carbon paper, Joule-heat it into a copper oxide, activate it electrochemically into copper, then operate it under CO ${src('P03')}. Each arrow is a transformation that can create, keep or destroy structure.</p>

<h2><span class="h-num">2.1</span>Why a copper-oxide precursor?</h2>
${claims([
  ['est', '<strong>It follows a route shown to transmit structure.</strong> Song et al. used flash Joule heating with rapid cooling to make copper-oxide precatalysts whose nanoscale features were inherited by the working copper ' + ref(1) + '. Building on that route makes the inheritance half of the question concrete.'],
  ['bgd', '<strong>Nitrate solutions are easy to automate.</strong> A dissolved salt sprays uniformly and decomposes cleanly on heating, which suits a robotic coater. This is general processing knowledge, not a claim from the cited papers.'],
  ['bgd', '<strong>Fast heating and quenching can freeze non-equilibrium microstructure.</strong> Short, hot, quickly cooled treatments limit coarsening, so grain and subgrain structure can be set by the thermal history.'],
  ['bgd', '<strong>The oxide-to-metal step is an opportunity.</strong> Removing oxygen forces the solid to rebuild locally. That is where activation conditions, such as the gas present, can act.'],
])}
${call('care', '<p>A PI will ask “why not just deposit copper metal?” Because then there is no reduction step for activation to act on, and the inheritance question disappears. The oxide is the medium through which processing history can reach the working catalyst.</p>', { side: true })}

<h2><span class="h-num">2.2</span>From nitrate to oxide to copper</h2>
<p>On heating, copper nitrate decomposes to copper oxide, releasing nitrogen oxides and oxygen. On a carbon support at high temperature, carbon can also pull oxygen away, so the product may be a mixture of CuO, Cu₂O and even some Cu. The proposal therefore treats the phase fractions as <em>measured outcomes</em> rather than assuming a composition from the recipe ${src('P04')}.</p>
${eq('2 Cu(NO<sub>3</sub>)<sub>2</sub> <span class="up">→</span> 2 CuO + 4 NO<sub>2</sub> + O<sub>2</sub>', 'Textbook thermal decomposition, shown as background. The real phase mixture on Joule-heated carbon paper is measured by diffraction.')}
<p>Activation then reduces the oxide toward copper. The oxygen has to leave, and the volume per copper atom drops sharply:</p>

<tr><td>CuO</td><td class="num">79.55</td><td class="num">6.31</td><td class="num">12.6</td><td class="num">−44%</td></tr>
<tr><td>Cu₂O</td><td class="num">143.09</td><td class="num">6.0</td><td class="num">11.9</td><td class="num">−41%</td></tr>
<tr><td>Cu</td><td class="num">63.55</td><td class="num">8.96</td><td class="num">7.1</td><td class="num">—</td></tr></tbody></table></div>
<p class="small muted ui">${ev('bgd')} Arithmetic from standard densities. It explains why reduction creates porosity and new interfaces; it does not predict the resulting microstructure.</p>

<h2><span class="h-num">2.3</span>Follow the transformation</h2>

])}

${concept({
  title: 'Dwell is an input; microstructure is an outcome',
  intuition: '<p>Baking time is an input; how done the bread is is an outcome. Two loaves baked the same time can come out differently if the oven is uneven, and doubling the time does not double anything in particular. Dwell works the same way: it gives atoms time at temperature, and several things can happen in that time.</p>',
  formal: '<p>Let the thermal program be the input vector (ramp, peak T, dwell, cooling). The precursor state is a set of measured descriptors: oxide phase fractions, coherent-domain dimensions, particle connectivity and porosity, grain/subgrain structure, loading. A longer dwell can change several descriptors at once: grain coarsening, carbothermal reduction of CuO toward Cu₂O or Cu on the carbon support, neck growth between particles, and changes to the support itself.</p>',

${rig(`<p>A common textbook model for normal grain growth at constant temperature is ${eq('D² − D₀² = k₀ exp(−Q/RT) · t', 'D grain size, D₀ initial size, Q an activation energy, t time at temperature. Background, not a claim about this system.')} Two consequences matter here. First, at fixed T, the change in D² grows linearly with dwell, so doubling dwell does not double D. Second, the rate depends exponentially on temperature: with Q ≈ 150 kJ mol⁻¹ near 1000 K, a 3% temperature error (30 K) changes the rate by roughly exp(Q·ΔT/RT²) ≈ 1.7×. A small, unrecorded temperature difference between heating runs could easily masquerade as a dwell effect. That is the quantitative reason to record calibrated traces instead of trusting electrical power.</p>`, 'why the trace matters')}
<h2><span class="h-num">6.2</span>Controls born at this step</h2>

<li><strong>Independent runs.</strong> Each coating/heating run is a replicate; repeated measurements of one sheet are not ${src('P03')}.</li>

${call('mis', '<p><strong>“Longer dwell means larger grains.”</strong> Plausible, not guaranteed. It may also change oxide fraction, porosity or contacts. The proposal treats every one of these as a measurement ' + src('P03') + '.</p>')}
${check('q-trace')}

  /* ---------------- Lesson 7 ---------------- */
  WC.lesson({
    id: 'activation', part: 'materials', short: 'What activation means', minutes: 16,
    title: 'What <em>activation</em> actually means',
    lede: 'Activation is the electrochemical reduction of the oxide precatalyst into copper, under a shared current program, with either CO or N₂ present. Same electrons in does not mean same copper out.',
    goals: ['The physical events during activation under CO and under N₂.', 'Why equal charge does not imply equal reduction, and why equal current does not imply equal cathode potential.', 'Why the activation endpoint is not the final working state.'],
    concepts: ['c-activation', 'c-charge'],
    body: () => `
<p><q>A pilot will cross two dwell times, at fixed peak temperature and cooling, with CO or N2 activation. Total flow and the current–time program will be shared; all electrodes then enter identical CO-fed membrane-electrode-assembly (MEA) tests.</q> ${src('P03')}</p>
<h2><span class="h-num">7.1</span>What happens, physically</h2>
<div class="grid-2"><div><h3 class="lab">Under CO</h3><ul class="small ui"><li>Oxide reduces; oxygen leaves as water/hydroxide; volume shrinks.</li><li>Fresh copper is born in contact with CO, which adsorbs strongly. In Li’s flow cell this produced Cu adparticles ${ref(2)}.</li><li>CO itself reduces to products, consuming part of the current. These products are collected separately ${src('P05')}.</li><li>Hydrogen evolution takes some current.</li></ul></div>
<div><h3 class="lab">Under N₂</h3><ul class="small ui"><li>Oxide reduces; volume shrinks.</li><li>No adsorbing reactant; in Li, the surface became grain-boundary-rich ${ref(2)}.</li><li>Current not used by oxide reduction goes mostly to hydrogen evolution.</li><li>The electrode first meets CO when the common test starts, and may restructure then (as Li’s did).</li></ul></div></div>
${call('key', '<p>Only the <strong>gas during activation</strong> differs. Flow and the current–time program are shared, and every electrode is tested under CO afterward. If the test feed differed, a product difference would just mean one electrode was given reactant.</p>')}

<h2><span class="h-num">7.2</span>Equal charge is not equal reduction</h2>
${concept({
  title: 'Charge is shared among processes',
  intuition: '<p>A fixed number of electrons flows into each electrode. Oxide reduction is only one place they can go. Hydrogen evolution takes some; under CO, CO reduction takes some more. Two electrodes can receive identical charge and end up reduced to different extents.</p>',
  formal: `<p>Total charge Q = ∫ I dt = Q<sub>oxide</sub> + Q<sub>H₂</sub> + Q<sub>CO red</sub> + Q<sub>capacitive</sub>. Full reduction of the oxide needs Q<sub>full</sub> = F·n<sub>Cu</sub>·(2x<sub>CuO</sub> + x<sub>Cu₂O</sub>), where x are the copper fractions in each oxide: two electrons per Cu from CuO, one from Cu₂O. Equal Q guarantees nothing about Q<sub>oxide</sub>/Q<sub>full</sub>.</p>`,
  example: '<p>Use the calculator below: with the same program, an N₂ electrode that sends 60% of its charge to hydrogen and a CO electrode that sends 30% to hydrogen and 45% to CO reduction reach very different reduction fractions.</p>',
  counter: '<p>If the program passes far more charge than Q<sub>full</sub>, both electrodes may reach complete reduction despite different partitions. Then equal endpoints are plausible, but they still have to be checked, not assumed ' + src('P03') + '.</p>',
  why: '<p>If the two gases leave different residual oxide, an apparent “gas effect on structure” could simply be a difference in how far reduction went. That is why the proposal says <q>equal charge alone will not establish equal conversion</q> and checks endpoints structurally.</p>',
  check: 'q-charge',
})}
${widget('charge')}

<h2><span class="h-num">7.3</span>Equal current is not equal potential</h2>
<p>Activation is current-controlled (galvanostatic). The cathode potential then floats to whatever value lets the set current flow. Under CO, extra reactions are available to carry the current, so the potential can settle at a different value than under N₂, where hydrogen evolution and oxide reduction must carry it. Surface area, local pH and transport shift it too. The driving force for oxide reduction is therefore not guaranteed equal across gases.</p>
${rig(`<p>In an MEA, the measured cell voltage is roughly V<sub>cell</sub> = E<sub>anode</sub> − E<sub>cathode</sub> + I·R<sub>Ω</sub> plus transport losses. Without a reliable reference electrode at the cathode, V<sub>cell</sub> cannot be decomposed, so “equal cell voltage” would not mean equal cathode potential either. The proposal reports voltage and checks the endpoint structurally rather than claiming matched potentials ${src('P05')}.</p>`, 'what voltage you can measure')}
${reviewer('Why not activate at a controlled potential instead of a shared current program?', 'A shared current program is reproducible and does not need a reliable cathode reference in an MEA, which is hard. Potential control would equalize driving force but let current and charge differ. Each choice leaves something unequal; the proposal chooses shared current and measures the endpoint. Whether a potential-controlled variant should be added is a design question to discuss with an adviser.')}
${call('dist', '<p><strong>Did the gas change structure, or only how far reduction went?</strong> Measure oxide fraction at the endpoint. If the gases leave different residual oxide, extend the N₂ (or CO) activation until oxide fractions match and see whether the structural and product contrasts persist. If they vanish once reduction is matched, the “gas effect” was a reduction-extent effect.</p>')}

<h2><span class="h-num">7.4</span>The endpoint is not the working state</h2>
<p>After activation the gas switches to CO for the common test. An N₂-activated electrode meets CO for the first time at that moment. In Li’s flow cell, that is when the N₂-derived grain boundaries were eliminated and nanobumps formed ${ref(2)}. So a gas effect could be large at the start of the test and fade. That is why the proposal measures an early product window as well as the primary late window, and characterizes structure after operation as well as at the activation endpoint ${src('P04')} ${src('P05')}.</p>
${call('asm', '<p>That a comparable reduction endpoint can be reached and verified under both gases, and that the activation products can be physically collected apart from the test products ' + src('P03') + ' ' + src('P05') + '.</p>')}
${check('q-potential')}
${check('q-endpoint')}
`,
  });

    title: 'The 2×2 experiment: an interaction is a <em>difference of differences</em>',
    lede: 'Two dwells crossed with two gases gives four cells. A main effect asks “does this factor help on average?” An interaction asks “does one factor’s effect depend on the other?” The proposal is about the second.',
    goals: ['How the four pilot cells are built and what is held constant.', 'How to compute both main effects and the interaction by hand.', 'Why an interaction is not a main effect, and why lines need not cross to interact.'],

<div class="table-wrap"><table><thead><tr><th><span class="sr-only">Precursor</span></th><th>Activated in N₂</th><th>Activated in CO</th></tr></thead><tbody>
<tr><th scope="row">Dwell t₀ (reference)</th><td>m(t₀, N₂)</td><td>m(t₀, CO)</td></tr>
<tr><th scope="row">Dwell t₁</th><td>m(t₁, N₂)</td><td>m(t₁, CO)</td></tr></tbody></table></div>
<p>Each cell is the mean late-window n-propanol partial current density of independently prepared electrodes in that condition. Peak temperature, cooling, total flow, the current–time program and the CO test are shared ${src('P03')}. Independent coating/heating runs are replicated, with day and reactor channel balanced across cells.</p>
${concept({
  title: 'Main effect versus interaction',
  intuition: '<p>Suppose CO activation adds 5 mA cm⁻² whichever precursor you use. That is a main effect: useful, but it says nothing about precursor history. Now suppose CO adds 8 to one precursor and 2 to the other. The benefit of CO depends on how the precursor was made. That dependence is the interaction.</p>',
  formal: `${eq('gas effect at dwell t: g(t) = m(t, CO) − m(t, N₂)')}${eq('interaction Δ = g(t₁) − g(t₀) = [m(t₁,CO) − m(t₁,N₂)] − [m(t₀,CO) − m(t₀,N₂)]', 'A difference of differences. Swap the roles of the factors and you get the same number: the dwell effect under CO minus the dwell effect under N₂.')}<p>Main effects in a balanced 2×2 are averages over the other factor: gas main effect = ½[g(t₀) + g(t₁)], dwell main effect = ½[(m(t₁,N₂) − m(t₀,N₂)) + (m(t₁,CO) − m(t₀,CO))].</p>`,
  example: '<p>N₂: 14 at t₀, 14 at t₁. CO: 28 at t₀, 18 at t₁. Gas effect at t₀ = 14; at t₁ = 4. Δ = 4 − 14 = −10. CO helps at both dwells (positive gas main effect), but much less at t₁: a strong interaction.</p>',
  counter: '<p>N₂: 12 and 16. CO: 18 and 22. Both factors help, but the gas effect is 6 at both dwells, so Δ = 0. Two real effects, no interaction. Lines on the plot are parallel.</p>',
  why: '<p>The materials hypothesis predicts gas-dependent retention of precursor contrasts. In a 2×2, that is precisely a nonzero difference of differences in structure and in products. θ(t) in Aim 2 generalizes Δ to a whole curve of dwells ' + go('theta', 'Lesson 19') + '.</p>',
  check: 'q-dod',
})}
${widget('twobytwo')}
${call('mis', '<p><strong>“No crossing lines, no interaction.”</strong> Any non-parallel pattern on this additive scale is an interaction. Crossing (a ranking reversal) is just the most dramatic kind.</p>', { side: true })}
${rig(`<p>Write the four cell means as a regression with centered (±½) codes D for dwell and G for gas:</p>${eq('m = β₀ + β<sub>D</sub>·D + β<sub>G</sub>·G + β<sub>DG</sub>·D·G')}<p>With ±½ coding, β<sub>D</sub> and β<sub>G</sub> are the main effects defined above and β<sub>DG</sub> equals the difference of differences Δ. With 0/1 dummy coding, β<sub>D</sub> and β<sub>G</sub> instead become “simple effects” at the reference level, a frequent source of confusion when reading regression output.</p><p><strong>Scale matters.</strong> The proposal defines the interaction on the additive scale of partial current density. On a log scale (ratios), the same data can show a different interaction or none. Choosing the scale after seeing which one looks interesting is a forking-paths error, so the scale is fixed in advance ${src('P07')}.</p><p><strong>Precision.</strong> If each cell has n independent preparations with preparation-level standard deviation σ, the four cell means are independent and Var(Δ̂) = 4σ²/n, so SE(Δ̂) = 2σ/√n. An interaction is estimated with twice the standard error of a single cell mean, which is why interactions need more replication than main effects ${go('replication', 'Lesson 13')}.</p>`, 'regression view and precision')}
${reviewer('Why only two dwells in the pilot?', 'Because the pilot’s job is to validate the assays, estimate preparation variance and check that a precursor contrast exists. Two levels give one interaction contrast. Aim 2 then expands dwell and gas composition within the tested window and learns θ(t) as a curve.')}
${check('q-dod-num')}
${check('q-main')}
`,
  });

    goals: ['Each structural term, its scale and what it is not.', 'Which instrument sees which feature, and each instrument’s blind spots.', 'Why diffraction width alone cannot identify grain boundaries.'],

<p>The proposal names specific descriptors: <q>oxide fractions, coherent-domain dimensions and particle connectivity</q> from diffraction and microscopy, plus blinded TEM of <q>selected surface and grain/subgrain structures</q> ${src('P04')}. Click through the explorer to see where each lives in an electrode and what can observe it.</p>
${widget('grains')}
${concept({
  title: 'Crystallite size is not grain size',
  intuition: '<p>X-rays measure how far order extends coherently. Anything that breaks that order (a grain boundary, but also a twin, a stacking fault, a low-angle subgrain boundary or strain) shortens the coherent domain. So the XRD “crystallite size” is a lower bound-ish proxy, not a count of grains.</p>',
  formal: `<p>Scherrer analysis relates peak breadth β (radians, after removing instrumental broadening) to a volume-weighted coherent-domain size L: L = Kλ/(β cos θ), with K ≈ 0.9. Strain also broadens peaks; Williamson–Hall analysis separates them approximately: β cos θ = Kλ/L + 4ε sin θ. Neither gives grain-boundary density, boundary character or where boundaries sit.</p>`,
  example: '<p>Song et al. describe ≈10 nm intragrain features inside ≈35 nm grains ' + ref(1) + '. A diffraction-derived size might sit near the smaller of those numbers, because intragrain features interrupt coherence, even though the grains are larger.</p>',
  counter: '<p>A sample of large, nearly perfect grains with high microstrain can show broad peaks and a small apparent “crystallite size.” Read naively, it would be called fine-grained when it is not.</p>',

})}
<h2><span class="h-num">9.1</span>Instruments and what they cannot see</h2>
<div class="table-wrap"><table><thead><tr><th>Method</th><th>Sees well</th><th>Blind spots and risks</th><th>Role here</th></tr></thead><tbody>
<tr><td>XRD</td><td>Phases and their fractions; coherent-domain size; microstrain; averaged over a large volume</td><td>No location; no boundary density; weak for thin surface layers and small minority phases</td><td>Oxide fraction before activation and at the endpoint; coherent-domain dimensions</td></tr>
<tr><td>SEM</td><td>Particles, aggregates, surface porosity, cracks, coverage of fibers</td><td>Grains inside particles usually invisible; surface only</td><td>Particle connectivity and morphology across stages</td></tr>
<tr><td>TEM / HRTEM, diffraction in TEM</td><td>Grains, subgrains, twins, lattice fringes, local phase</td><td>Tiny sampled area; beam and sample preparation can alter copper; destructive; needs air-free transfer</td><td>Blinded, selected grain/subgrain and surface structure on companions</td></tr>
<tr><td>Orientation mapping (4D-STEM and related)</td><td>Grain orientations and boundary character</td><td>Specialized, slow, small areas</td><td>Not named in the proposal; a possible extension (background)</td></tr>
<tr><td>Double-layer capacitance (ECSA proxy)</td><td>Electrochemically accessible area, roughness</td><td>Depends on wetting; not structure-specific</td><td>Not named in the proposal; useful context for roughness and wetting (background)</td></tr>
<tr><td>ICP-OES</td><td>Element amounts: copper loading, contaminants such as iridium from the anode</td><td>No structure, no location</td><td>Loading and contamination checks ${src('P04')}</td></tr></tbody></table></div>
${call('mis', '<p><strong>“Blinded TEM gives a representative picture.”</strong> Blinding prevents the analyst’s expectations from steering what is measured. Representativeness is a separate problem, addressed by sampling several fields and particles and pairing TEM with bulk diffraction.</p>', { side: true })}

${check('q-term')}
`,

    concepts: ['c-postmortem', 'c-companion'],
    body: () => `
${widget('journey')}
<h2><span class="h-num">10.1</span>Why postmortem copper is dangerous</h2>
<p>Every structural measurement of copper in this project happens after the bias is turned off. That creates three problems:</p>
<ol><li><strong>Air re-oxidizes copper.</strong> Yang et al. watched metallic copper nanograins under bias become single-crystal Cu₂O nanocubes after electrolysis and air exposure ${ref(4)}.</li><li><strong>Relaxation without bias.</strong> Without the reducing potential and adsorbed CO, surfaces can rearrange even without oxygen.</li><li><strong>Preparation and the beam.</strong> Cutting, thinning and the electron beam itself can alter copper.</li></ol>
${concept({
  title: 'Air-free transfer versus deliberate exposure',
  intuition: '<p>You cannot prove a protected transfer changed nothing. You can test whether exposure matters: treat one sample with protected transfer and a sibling with deliberate air exposure. If they look the same, handling is probably not dominating at your sensitivity. If they differ, you have measured the size of the artifact.</p>',
  formal: '<p>Let S<sub>op</sub> be the operando structure, S<sub>af</sub> the air-free recovered structure and S<sub>ex</sub> the deliberately exposed one. The control estimates S<sub>ex</sub> − S<sub>af</sub>, the handling effect. It cannot estimate S<sub>af</sub> − S<sub>op</sub>, the bias-removal effect. Only operando methods address that, and the proposal makes operando beamtime optional ' + src('P10') + '.</p>',
  example: '<p><q>Air-free transfer will be checked against deliberate exposure [4].</q> ' + src('P04') + '</p>',
  counter: '<p>If both protected and exposed samples show the same Cu₂O shell, the protected transfer failed, or oxidation happened before transfer. A “no difference” result is only informative if the protected transfer is shown to work on a positive control.</p>',
  why: '<p>All structure–performance claims rest on recovered states. The control bounds one source of error and keeps the interpretation honest about the rest.</p>',
  check: 'q-airfree',
})}
<h2><span class="h-num">10.2</span>Companion electrodes</h2>
<p>TEM consumes the specimen. Some other assays perturb it: wetting a surface with liquid, for instance. The performance electrode must stay intact for its test, or has already been changed by it. So the proposal uses <q>identically prepared companions, with mismatch estimated experimentally</q> ${src('P04')}. A companion shares the processing history. It is not the same object.</p>
${widget('companion')}
${call('unres', '<p><strong>How companions are made is a design choice the proposal leaves open.</strong> Cut from the same heated sheet as the performance electrode, they share that run’s exact thermal history but may sit at different places on a nonuniformly heated sheet. Made in separate runs, they add run-to-run variation. Which gives smaller, better-characterized mismatch is a pilot question.</p>')}
${reviewer('Why should I believe the TEM of an electrode you did not test?', 'Only as much as measured companion consistency justifies. The proposal estimates mismatch, for example by assaying pairs of companions from the same run, and carries it into the model, so a companion assay narrows uncertainty about the tested electrode only as much as it should.')}
${call('mis', '<p><strong>“Identically prepared means identical.”</strong> It means same recipe and run. Loading, local temperature and microstructure still vary. Treating a companion as the tested electrode is a hidden assumption a reviewer will find.</p>')}
${check('q-companion')}
`,
  });

<p><q>The primary outcome is late-window n-propanol partial current density at fixed total current in a two-hour screen; an early window tests evolution.</q> ${src('P05')}</p>
<h2><span class="h-num">11.1</span>The measurement chain</h2>
<div class="chart wide"><svg viewBox="0 0 760 210" role="img" aria-label="Measurement chain: the MEA cathode outlet gas goes to online GC for hydrogen, ethylene and other gases; liquid from the cathode side and the anolyte (which receives crossover) is collected and analyzed by quantitative NMR for n-propanol, ethanol and acetate. Losses: volatile alcohols in the gas stream, crossover to the anode where alcohols can be oxidized, collection delay.">
<defs><marker id="ah2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" style="fill:var(--muted)"/></marker></defs>
<rect x="10" y="60" width="150" height="90" rx="8" style="fill:var(--copper-soft);stroke:var(--copper)"/><text x="85" y="95" text-anchor="middle" class="svg-title">MEA</text><text x="85" y="113" text-anchor="middle" class="svg-text">Cu cathode | membrane</text><text x="85" y="128" text-anchor="middle" class="svg-text">| anode</text>

<rect x="275" y="20" width="170" height="56" rx="8" style="fill:var(--surface);stroke:var(--rule-strong)"/><text x="360" y="44" text-anchor="middle" class="svg-title">Online GC</text><text x="360" y="62" text-anchor="middle" class="svg-text">H₂, C₂H₄, CO … minutes</text>
<path d="M160 125 L270 160" style="stroke:var(--muted);fill:none" marker-end="url(#ah2)"/><text x="170" y="165" class="svg-text">cathode liquid + anolyte</text>
<rect x="275" y="130" width="170" height="56" rx="8" style="fill:var(--surface);stroke:var(--rule-strong)"/><text x="360" y="154" text-anchor="middle" class="svg-title">Liquid collection</text><text x="360" y="172" text-anchor="middle" class="svg-text">per window, timed</text>
<path d="M445 158 L530 158" style="stroke:var(--muted);fill:none" marker-end="url(#ah2)"/>
<rect x="535" y="130" width="200" height="56" rx="8" style="fill:var(--surface);stroke:var(--rule-strong)"/><text x="635" y="154" text-anchor="middle" class="svg-title">Quantitative NMR</text><text x="635" y="172" text-anchor="middle" class="svg-text">n-propanol, ethanol, acetate · hours–days</text>
<rect x="500" y="20" width="235" height="80" rx="8" style="fill:var(--st-unres-bg);stroke:var(--st-unres);stroke-dasharray:4 3"/><text x="617" y="40" text-anchor="middle" class="svg-title" style="fill:var(--st-unres)">Where product goes missing</text><text x="512" y="60" class="svg-text">· volatile alcohol carried off in gas</text><text x="512" y="75" class="svg-text">· crossover → anode oxidation (Xu)</text><text x="512" y="90" class="svg-text">· holdup delays · outlet flow ≠ inlet</text>
</svg></div>
<p>Gases leave with the outlet stream and are measured by online gas chromatography within minutes. Liquid products accumulate on the cathode side and, after crossing the membrane, in the anolyte; they are collected for each window and quantified by NMR with an internal standard, which may take hours or days to queue. The proposal checks <q>volatile-product recovery, collection delay, outlet flow and crossover</q> ${src('P05')}. Xu et al. found ethanol oxidized at the anode of CO MEAs, one concrete way crossover destroys product ${ref(5)}.</p>
${call('bgd', '<p>Outlet flow differs from inlet flow because CO is consumed and products are added. Computing gas-product rates from GC concentration times inlet flow can therefore be biased; measuring outlet flow avoids that.</p>', { side: true })}
<h2><span class="h-num">11.2</span>Faradaic efficiency and partial current</h2>
${eq('FE<sub>i</sub> = n<sub>i</sub> · F · N<sub>i</sub> / Q', 'n_i electrons per molecule (12 for n-propanol from CO), F = 96 485 C mol⁻¹, N_i moles of product detected in the window, Q charge passed in the window.')}
${eq('j<sub>i</sub> = |j<sub>total</sub>| × FE<sub>i</sub>', 'Partial current density: the share of current density that went into product i. It is computed, not measured with a separate wire.')}
<p>At fixed total current, partial current and FE carry the same information. Partial current density is the absolute rate of making n-propanol per area, which is what “production” means. Divide by n<sub>i</sub>F to get a molar rate.</p>
${widget('accounting')}
${call('mis', '<p><strong>“C₃/C₂ went up, so the catalyst got better.”</strong> The ratio can rise because C₂ fell while n-propanol also fell. Ratios are diagnostic; absolute production, charge balance and voltage stay reported ' + src('P05') + '.</p>')}
<h2><span class="h-num">11.3</span>Early and late windows</h2>
<p>The catalyst may still be changing during the two-hour screen, especially an N₂-activated electrode meeting CO for the first time ${ref(2)}. Pooling the whole run would average two different catalysts. The late window reflects a more settled state and is the primary outcome; the early window tests evolution. Because liquids take time to reach the collector, collection delay must be known or products land in the wrong window.</p>
${widget('collection')}
<h2><span class="h-num">11.4</span>What 50 hours can and cannot show</h2>
${claims([

  ['unres', 'Industrial lifetime, behavior at other currents, and slow device failure modes. Not claimed.'],
])}
${reviewer('Why is partial current density, not Faradaic efficiency, the primary outcome?', 'At fixed total current they are proportional, so the comparison is the same. Partial current density states the quantity that matters, the absolute rate of making n-propanol, and it stays meaningful if a later study varies current. Ratios like C₃/C₂ remain diagnostics because they can rise while production falls.')}
${check('q-partial')}
${check('q-recovery')}
${check('q-windows')}
`,
